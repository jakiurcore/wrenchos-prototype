        <sc-if value="{{dw.fromDw}}" hint-placeholder-val="{{ false }}"><div class="banner banner-info"><span>{{dw.dwText}}</span></div></sc-if>

        <div class="field">
          <span class="label">Customer</span>
          <sc-if value="{{dw.notPicking}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #D0D5DD; border-radius: 6px; padding: 8px 10px"><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{dw.custName}}</span><span class="hint">{{dw.custSub}}</span></span><button class="btn btn-ghost btn-xs" onClick="{{dw.changeCust}}">Change</button></div>
          </sc-if>
          <sc-if value="{{dw.picking}}" hint-placeholder-val="{{ false }}">
            <div class="searchbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Find customer" placeholder="Name, phone or email" value="{{dw.pq}}" onChange="{{dw.onPq}}"></div>
            <div style="display: flex; flex-direction: column; border: 1px solid #E4E7EC; border-radius: 6px; overflow: hidden">
              <sc-for list="{{dw.matches}}" as="mt" hint-placeholder-count="4"><button class="li-btn" onClick="{{mt.pick}}"><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{mt.name}}</span><span class="hint">{{mt.sub}}</span></span></button></sc-for>
              <sc-if value="{{dw.noMatches}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No customers match.</span></div></sc-if>
            </div>
          </sc-if>
        </div>

        <div class="field">
          <span class="label" id="dw-veh-l">Vehicle</span>
          <div class="pick-grid" role="radiogroup" aria-labelledby="dw-veh-l">
            <sc-for list="{{dw.vehicles}}" as="vv" hint-placeholder-count="2"><button class="pick {{vv.cls}}" role="radio" aria-checked="{{vv.on}}" onClick="{{vv.pick}}"><span style="font-weight: 500">{{vv.name}}</span><span class="hint">{{vv.sub}}</span></button></sc-for>
          </div>
        </div>

        <div class="form-2">
          <div class="field"><label class="label" for="dw-date">Date</label><input id="dw-date" class="input" type="date" min="2026-11-24" value="{{dw.f.date}}" onChange="{{dw.onDate}}"></div>
          <div class="field"><label class="label" for="dw-time">Start time</label>
            <select id="dw-time" class="select" value="{{dw.f.time}}" onChange="{{dw.onTime}}"><option value="07:00">7:00 AM</option><option value="07:30">7:30 AM</option><option value="08:00">8:00 AM</option><option value="08:30">8:30 AM</option><option value="09:00">9:00 AM</option><option value="09:30">9:30 AM</option><option value="10:00">10:00 AM</option><option value="10:30">10:30 AM</option><option value="11:00">11:00 AM</option><option value="11:30">11:30 AM</option><option value="12:00">12:00 PM</option><option value="12:30">12:30 PM</option><option value="13:00">1:00 PM</option><option value="13:30">1:30 PM</option><option value="14:00">2:00 PM</option><option value="14:30">2:30 PM</option><option value="15:00">3:00 PM</option><option value="15:30">3:30 PM</option><option value="16:00">4:00 PM</option><option value="16:30">4:30 PM</option><option value="17:00">5:00 PM</option><option value="17:30">5:30 PM</option></select>
          </div>
          <div class="field"><label class="label" for="dw-dur">Duration</label>
            <select id="dw-dur" class="select" value="{{dw.f.dur}}" onChange="{{dw.onDur}}"><option value="0.5">30 min</option><option value="1">1 hour</option><option value="1.5">1.5 hours</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option></select>
          </div>
          <div class="field"><label class="label" for="dw-status">Status</label>
            <select id="dw-status" class="select" value="{{dw.f.status}}" onChange="{{dw.onStatus}}"><option value="Confirmed">Confirmed</option><option value="Tentative">Tentative</option><option value="Arrived">Arrived</option><option value="No-show">No-show</option></select>
          </div>
        </div>

        <div class="field">
          <span class="label" id="dw-bay-l">Technician bay</span>
          <div class="pick-grid" role="radiogroup" aria-labelledby="dw-bay-l">
            <sc-for list="{{dw.bays}}" as="by" hint-placeholder-count="4"><button class="pick {{by.cls}}" role="radio" aria-checked="{{by.on}}" onClick="{{by.pick}}"><span style="font-weight: 500">{{by.label}}</span><span class="hint">{{by.sub}}</span></button></sc-for>
          </div>
        </div>
        <sc-if value="{{dw.hasWarn}}" hint-placeholder-val="{{ false }}"><div class="err-text" role="status">{{dw.warn}}</div></sc-if>

        <div class="field"><label class="label" for="dw-reason">Reason for visit</label><input id="dw-reason" class="input" placeholder="e.g. Brake inspection" value="{{dw.f.reason}}" onChange="{{dw.onReason}}"></div>

        <div class="field"><label class="label" for="dw-notify">Notify customer</label>
          <select id="dw-notify" class="select" value="{{dw.f.notify}}" onChange="{{dw.onNotify}}"><option value="pref">Preferred channel</option><option value="SMS">SMS</option><option value="Email">Email</option><option value="WhatsApp">WhatsApp</option><option value="none">Don't send</option></select>
          <span class="hint">{{dw.notifyHint}}</span>
        </div>
      </div>
      <div class="drawer-ft">
        <sc-if value="{{dw.isEdit}}" hint-placeholder-val="{{ false }}"><button class="btn btn-danger" onClick="{{dw.cancelAppt}}">Cancel appointment</button></sc-if>
        <span class="sp"></span>
        <button class="btn btn-ghost" onClick="{{dw.close}}">Close</button>
        <button class="btn btn-primary" onClick="{{dw.save}}">{{dw.saveLabel}}</button>
      </div>
    </div>
  </div>
</sc-if>

<!-- Demo guide -->
<sc-if value="{{guide.open}}" hint-placeholder-val="{{ false }}">
  <aside aria-label="Demo guide" style="position: fixed; right: 16px; top: 68px; width: 380px; max-width: calc(100vw - 32px); max-height: calc(100vh - 88px); display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; box-shadow: 0 16px 40px rgba(16, 24, 40, .16); z-index: 65; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #E4E7EC"><div style="flex: 1"><div style="font-weight: 700">Demo guide</div><div class="hint">John Smith, end to end · {{guide.progress}}</div></div><button class="btn btn-ghost btn-sm" onClick="{{guide.minimize}}">Minimize</button><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close demo guide" onClick="{{guide.close}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div style="padding: 8px 14px 0"><span class="meter"><span class="meter-fill ok" style="width: {{guide.pct}}%"></span></span></div>
    <ol style="list-style: none; margin: 0; padding: 8px 10px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{guide.steps}}" as="gs" hint-placeholder-count="10">
        <li class="step {{gs.cls}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-radius: 8px">
          <span class="sn" style="margin-top: 1px"><sc-if value="{{gs.done}}" hint-placeholder-val="{{ false }}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; stroke-width: 3"><path d="M5 12l5 5 9-10"/></svg></sc-if><sc-if value="{{gs.notDone}}" hint-placeholder-val="{{ true }}">{{gs.n}}</sc-if></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 600; color: #101828">{{gs.t}}</span>
            <sc-if value="{{gs.cur}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 400; color: #475467; line-height: 1.45">{{gs.d}}</span></sc-if>
            <span style="display: flex; gap: 6px"><button class="btn btn-xs {{gs.goCls}}" onClick="{{gs.go}}">{{gs.goLabel}}</button><button class="btn btn-xs btn-ghost" onClick="{{gs.mark}}">{{gs.markLabel}}</button></span>
          </div>
        </li>
      </sc-for>
    </ol>
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #E4E7EC"><span class="hint" style="flex: 1">Steps tick themselves off as you work.</span><button class="btn btn-secondary btn-sm" onClick="{{guide.restart}}">Restart demo data</button></div>
  </aside>
</sc-if>
<sc-if value="{{guide.min}}" hint-placeholder-val="{{ false }}">
  <button class="btn btn-primary" onClick="{{guide.expand}}" style="position: fixed; right: 16px; top: 68px; z-index: 65; box-shadow: 0 8px 24px rgba(16, 24, 40, .16)">Demo guide · {{guide.progress}}</button>
</sc-if>
