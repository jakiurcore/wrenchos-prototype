          </section>

          <!-- Totals (advisor only) -->
          <sc-if value="{{rod.showPrices}}" hint-placeholder-val="{{ true }}">
            <section class="panel">
              <div class="panel-hd"><h2 class="h2">Totals</h2></div>
              <div class="panel-bd"><div class="tot"><sc-for list="{{rod.totals}}" as="tt" hint-placeholder-count="3"><span class="muted">{{tt.k}}</span><span>{{tt.v}}</span></sc-for><span class="grand">Total</span><span class="grand">{{rod.total}}</span></div></div>
            </section>
          </sc-if>

          <!-- Stock movements -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Stock movements</h2><span class="muted" style="font-size: 12px">Linked to {{rod.id}}</span></div>
            <sc-for list="{{rod.moves}}" as="mv" hint-placeholder-count="2"><div class="li" style="flex-wrap: nowrap"><span class="mono muted" style="font-size: 12px; min-width: 64px">{{mv.part}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="ellip">{{mv.type}}</span><span class="hint">{{mv.when}} · {{mv.by}}</span></span><span class="badge {{mv.bcls}}" style="font-variant-numeric: tabular-nums">{{mv.qty}}</span></div></sc-for>
            <sc-if value="{{rod.noMoves}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>Stock moves are written when parts are recorded as used.</span></div></sc-if>
          </section>

          <!-- Activity -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Activity log</h2></div>
            <div class="panel-bd" style="padding-top: 6px; max-height: 420px; overflow: auto"><div class="tl"><sc-for list="{{rod.log}}" as="lg" hint-placeholder-count="4"><div class="tl-item"><span class="tl-dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg></span><div class="tl-body"><span><strong style="font-weight: 600">{{lg.who}}</strong> · {{lg.text}}</span><span class="tl-meta">{{lg.when}}</span></div></div></sc-for></div></div>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- ============ ESTIMATE BUILDER ============ -->
    <sc-if value="{{view.estimate}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="4"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd" style="align-items: center">
        <div style="min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h1 class="h1">{{est.id}}</h1><span class="tag tag-gray">{{est.ver}}</span><span class="badge {{est.bcls}}">{{est.status}}</span></div>
          <div class="muted ellip" style="font-size: 12px">{{est.title}}</div>
        </div>
        <span class="sp"></span>
        <sc-if value="{{est.showRevise}}" hint-placeholder-val="{{ false }}"><span class="tipwrap" data-tip="{{est.reviseTip}}"><button class="btn btn-secondary" disabled="{{est.reviseDisabled}}" onClick="{{est.revise}}">Revise estimate</button></span></sc-if>
        <sc-if value="{{est.showPortal}}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{est.openPortal}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg>{{est.portalLabel}}</button></sc-if>
        <sc-if value="{{est.canConvert}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{est.convert}}">Convert approved jobs to RO</button></sc-if>
        <sc-if value="{{est.isConverted}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{est.openRo}}">Open {{est.roId}}</button></sc-if>
        <sc-if value="{{est.showSend}}" hint-placeholder-val="{{ true }}">
          <button class="btn btn-secondary" onClick="{{est.saveDraft}}">Save draft</button>
          <span class="tipwrap" data-tip="{{est.sendTip}}"><button class="btn btn-primary" disabled="{{est.sendDisabled}}" onClick="{{est.send}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Send for approval</button></span>
        </sc-if>
      </div>

      <sc-if value="{{est.viewingOld}}" hint-placeholder-val="{{ false }}"><div class="banner banner-info"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>{{est.oldBanner}}</span></div></sc-if>
      <sc-if value="{{est.isSupp}}" hint-placeholder-val="{{ false }}"><div class="banner banner-info"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg><span>{{est.suppText}}</span></div></sc-if>
      <sc-if value="{{est.isSent}}" hint-placeholder-val="{{ false }}"><div class="banner" style="background: #FFFBEB; border-color: #F5D58A; color: #78350F"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>{{est.sentText}}</span><span class="sp"></span><button class="btn btn-secondary btn-sm" onClick="{{est.openPortal}}">Open customer portal (simulate customer)</button></div></sc-if>
      <sc-if value="{{est.isDecided}}" hint-placeholder-val="{{ false }}"><div class="banner" style="background: #F0FDF4; border-color: #A6E3BD; color: #14532D"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span>{{est.decidedText}} <sc-if value="{{est.addedToRo}}" hint-placeholder-val="{{ false }}"><strong>{{est.addedText}}</strong></sc-if></span></div></sc-if>
      <sc-if value="{{est.hasShort}}" hint-placeholder-val="{{ false }}"><div class="banner" style="background: #FEF3F2; border-color: #FECDCA; color: #912018"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>{{est.shortWarn}}</span></div></sc-if>

      <div class="est-layout">
        <div class="stack">
          <!-- Vehicle picker when none chosen -->
          <sc-if value="{{est.noVeh}}" hint-placeholder-val="{{ false }}">
            <section class="panel">
              <div class="panel-hd"><h2 class="h2">Choose a vehicle</h2><span class="muted" style="font-size: 12px">Search by plate, VIN, model or owner</span></div>
              <div class="panel-bd" style="display: flex; flex-direction: column; gap: 10px">
                <div class="searchbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Find vehicle" placeholder="e.g. ABC-1234 or John Smith" value="{{est.vehQ}}" onChange="{{est.onVehQ}}"></div>
                <div class="pick-grid"><sc-for list="{{est.vehPick}}" as="vk" hint-placeholder-count="4"><button class="pick" onClick="{{vk.pick}}"><span style="font-weight: 500">{{vk.name}}</span><span class="hint">{{vk.sub}}</span></button></sc-for></div>
              </div>
            </section>
          </sc-if>

          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Jobs and line items</h2><span class="muted" style="font-size: 12px">Each job is approved or declined on its own</span></div>
            <sc-for list="{{est.jobs}}" as="j" hint-placeholder-count="2">
              <div class="job">
                <div class="job-hd">
                  <span class="job-no">{{j.no}}</span>
                  <sc-if value="{{j.editable}}" hint-placeholder-val="{{ true }}"><input class="input input-sm" style="max-width: 320px; font-weight: 600" aria-label="Job name" placeholder="Job name, e.g. Brake Pad Replacement" value="{{j.name}}" onChange="{{j.onName}}"></sc-if>
                  <sc-if value="{{j.readonly}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; font-size: 14px">{{j.name}}</span></sc-if>
                  <span class="badge {{j.bcls}}">{{j.statusLabel}}</span>
                  <sc-if value="{{j.hasDecided}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 12px">{{j.decided}}</span></sc-if>
                  <span class="sp"></span>
                  <span style="font-weight: 600; font-variant-numeric: tabular-nums">{{j.total}}</span>
                  <sc-if value="{{j.editable}}" hint-placeholder-val="{{ true }}"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Remove job" onClick="{{j.remove}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></sc-if>
                </div>
                <div class="ln-wrap">
                  <div class="ln ln-head"><span>Type</span><span>Description</span><span class="num">Qty / hrs</span><span class="num">Rate</span><span class="num">Amount</span><span>Availability</span><span></span></div>
                  <sc-for list="{{j.lines}}" as="l" hint-placeholder-count="2">
                    <div class="ln">
                      <span><span class="tag tag-gray">{{l.tag}}</span></span>
                      <span style="min-width: 0; display: flex; flex-direction: column">
                        <sc-if value="{{l.isLabor}}" hint-placeholder-val="{{ true }}"><sc-if value="{{l.editable}}" hint-placeholder-val="{{ true }}"><input class="input input-sm" aria-label="Labor description" value="{{l.desc}}" onChange="{{l.onDesc}}"></sc-if><sc-if value="{{l.readonly}}" hint-placeholder-val="{{ false }}"><span class="ellip">{{l.desc}}</span></sc-if></sc-if>
                        <sc-if value="{{l.isPart}}" hint-placeholder-val="{{ false }}"><span class="ellip" style="font-weight: 500">{{l.desc}}</span></sc-if>
                        <span class="hint mono" style="font-size: 11px">{{l.sub}}</span>
                      </span>
                      <span class="num">
                        <sc-if value="{{l.editable}}" hint-placeholder-val="{{ true }}"><input class="input input-sm num" type="number" min="0" step="0.1" aria-label="{{l.qtyAria}}" value="{{l.qty}}" onChange="{{l.onQty}}"></sc-if>
                        <sc-if value="{{l.readonly}}" hint-placeholder-val="{{ false }}">{{l.qty}} {{l.unit}}</sc-if>
                      </span>
                      <span class="num muted">{{l.rate}}</span>
                      <span class="num" style="font-weight: 500">{{l.amt}}</span>
                      <span><span class="badge {{l.acls}}" style="max-width: 100%; overflow: hidden">{{l.avail}}</span></span>
                      <span><sc-if value="{{l.editable}}" hint-placeholder-val="{{ true }}"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Remove line" onClick="{{l.remove}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-if></span>
                    </div>
                  </sc-for>
                </div>
                <sc-if value="{{j.empty}}" hint-placeholder-val="{{ false }}"><div class="hint" style="padding: 10px 16px">No lines yet. Add labor or a part.</div></sc-if>
                <sc-if value="{{j.editable}}" hint-placeholder-val="{{ true }}">
                  <div class="job-ft">
                    <button class="btn btn-secondary btn-xs" onClick="{{j.addLabor}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Labor</button>
                    <button class="btn btn-secondary btn-xs" onClick="{{j.openPicker}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Part</button>
                    <sc-if value="{{j.picking}}" hint-placeholder-val="{{ false }}">
                      <div class="part-pop" role="dialog" aria-label="Add part">
                        <div style="display: flex; gap: 6px"><div class="searchbox" style="flex: 1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Search parts" placeholder="Part # or name" value="{{j.pickQ}}" onChange="{{j.onPickQ}}"></div><button class="btn btn-ghost btn-sm" onClick="{{j.closePicker}}">Close</button></div>
                        <sc-for list="{{j.pickResults}}" as="pr" hint-placeholder-count="4"><button class="li-btn" style="padding: 8px; border-radius: 6px; border-bottom: 0" onClick="{{pr.add}}"><span class="mono muted" style="min-width: 70px">{{pr.id}}</span><span style="flex: 1; min-width: 0"><span class="ellip" style="display: block">{{pr.name}}</span><span class="hint">{{pr.sub}}</span></span></button></sc-for>
                      </div>
                    </sc-if>
                  </div>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{est.noJobs}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span class="empty-title">No jobs yet</span><span>Start from the service menu below or add a custom job.</span></div></sc-if>
            <sc-if value="{{est.editable}}" hint-placeholder-val="{{ true }}">
              <div style="padding: 14px 16px; border-top: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 10px; background: #F9FAFB">
                <div style="display: flex; align-items: center; gap: 8px"><span class="label">Add a job from the service menu</span><span class="sp"></span><button class="btn btn-secondary btn-sm" onClick="{{est.addCustom}}">Custom job</button></div>
                <div class="tpl-grid"><sc-for list="{{est.templates}}" as="tp" hint-placeholder-count="5"><button class="pick" onClick="{{tp.add}}" style="background: #FFFFFF"><span style="font-weight: 500">+ {{tp.name}}</span><span class="hint">{{tp.sub}}</span></button></sc-for></div>
              </div>
            </sc-if>
          </section>

          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Approval history</h2></div>
            <div class="panel-bd" style="padding-top: 6px">
              <div class="tl"><sc-for list="{{est.history}}" as="h" hint-placeholder-count="3"><div class="tl-item"><span class="tl-dot {{h.kcls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg></span><div class="tl-body"><span><strong style="font-weight: 600">{{h.who}}</strong> · {{h.text}}</span><span class="tl-meta">{{h.when}}<sc-if value="{{h.hasCh}}" hint-placeholder-val="{{ false }}"> · {{h.ch}}</sc-if></span></div></div></sc-for></div>
            </div>
          </section>
        </div>

        <div class="stack">
          <sc-if value="{{est.hasVeh}}" hint-placeholder-val="{{ true }}">
            <section class="panel"><div class="panel-bd" style="display: flex; flex-direction: column; gap: 6px">
              <span class="kpi-label">Vehicle</span>
              <button class="lnk" style="font-size: 14px; font-weight: 600; color: #101828" onClick="{{est.openVeh}}">{{est.vehName}}</button>
              <span style="display: flex; gap: 8px; align-items: center; font-size: 12px; color: #475467"><span class="plate">{{est.plate}}</span>{{est.miles}}</span>
              <span class="kpi-label" style="margin-top: 6px">Customer</span>
              <button class="lnk" style="font-weight: 600" onClick="{{est.openCust}}">{{est.custName}}</button>
              <span class="hint">{{est.custSub}}</span>
            </div></section>
          </sc-if>

          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Totals</h2></div>
            <div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px">
              <div class="tot">
                <sc-for list="{{est.totals}}" as="tt" hint-placeholder-count="5"><span class="{{tt.cls}}">{{tt.k}}</span><span class="{{tt.cls}}">{{tt.v}}</span></sc-for>
                <span class="grand">Total</span><span class="grand">{{est.total}}</span>
                <sc-if value="{{est.showSplit}}" hint-placeholder-val="{{ false }}">
                  <span style="color: #166534; font-weight: 500">Approved</span><span style="color: #166534; font-weight: 600">{{est.approvedTotal}}</span>
                  <span style="color: #991B1B">Declined</span><span style="color: #991B1B">{{est.declinedTotal}}</span>
                </sc-if>
              </div>
              <sc-if value="{{est.editable}}" hint-placeholder-val="{{ true }}">
                <div class="form-2" style="gap: 8px">
                  <div class="field"><label class="label" for="est-dt">Discount</label><select id="est-dt" class="select" value="{{est.discType}}" onChange="{{est.onDiscType}}"><option value="pct">Percent (%)</option><option value="amt">Fixed amount</option></select></div>
                  <div class="field"><label class="label" for="est-dv">Value</label><input id="est-dv" class="input" type="number" min="0" step="1" value="{{est.discVal}}" onChange="{{est.onDiscVal}}"></div>
                </div>
              </sc-if>
              <sc-if value="{{est.readonly}}" hint-placeholder-val="{{ false }}"><span class="hint">{{est.discLabel}}</span></sc-if>
            </div>
          </section>

          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Note to customer</h2></div>
            <div class="panel-bd">
              <sc-if value="{{est.editable}}" hint-placeholder-val="{{ true }}"><textarea class="input textarea" aria-label="Note to customer" placeholder="Shown at the top of the approval page, e.g. Pads are at 2 mm; we recommend doing this today." value="{{est.note}}" onChange="{{est.onNote}}"></textarea></sc-if>
              <sc-if value="{{est.readonly}}" hint-placeholder-val="{{ false }}"><span class="muted">{{est.note}}</span></sc-if>
            </div>
          </section>

          <sc-if value="{{est.hasSig}}" hint-placeholder-val="{{ false }}">
            <section class="panel">
              <div class="panel-hd"><h2 class="h2">Customer signature</h2></div>
              <div class="panel-bd" style="display: flex; flex-direction: column; gap: 6px">
                <sc-if value="{{est.sigDrawn}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 326 140" role="img" aria-label="Signature of {{est.sigName}}" style="width: 100%; height: 110px; border: 1px solid #E4E7EC; border-radius: 8px; background: #FAFBFC"><path d="{{est.sigD}}" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if>
                <sc-if value="{{est.sigTyped}}" hint-placeholder-val="{{ false }}"><div class="sig-typed" style="height: 90px; font-size: 26px">{{est.sigName}}</div></sc-if>
                <span style="font-weight: 500">{{est.sigName}}</span><span class="hint">{{est.sigWhen}}</span>
              </div>
            </section>
          </sc-if>

          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Versions</h2></div>
            <div class="panel-bd" style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{est.versions}}" as="vr" hint-placeholder-count="1"><button class="chip {{vr.cls}}" aria-pressed="{{vr.on}}" onClick="{{vr.pick}}">{{vr.label}} <span class="muted" style="font-weight: 400">· {{vr.sub}}</span></button></sc-for>
            </div>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- ============ TECHNICIAN · MY JOBS ============ -->
    <sc-if value="{{view.myjobs}}" hint-placeholder-val="{{ false }}">
      <div class="page-hd">
        <div><div class="eyebrow">{{todayLabel}}</div><h1 class="h1">My jobs</h1></div>
        <span class="sp"></span>
      </div>
      <section class="panel"><div class="panel-hd" style="gap: 12px">
        <span class="av {{jobs.avCls}}" style="width: 36px; height: 36px; flex-basis: 36px; font-size: 12px">{{jobs.ini}}</span>
        <div><div style="font-weight: 600">{{jobs.name}}</div><div class="muted" style="font-size: 12px">{{jobs.summary}}</div></div>
        <span class="sp"></span>
        <sc-if value="{{jobs.clocked}}" hint-placeholder-val="{{ true }}"><span class="clock-on" style="font-size: 13px">{{jobs.clockText}}</span><button class="btn btn-secondary" onClick="{{jobs.clockOut}}">Clock out</button></sc-if>
        <sc-if value="{{jobs.idle}}" hint-placeholder-val="{{ false }}"><span class="muted">Not clocked in to a job</span></sc-if>
      </div></section>
      <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div class="jobs"><div class="skel" style="height: 280px"></div><div class="skel" style="height: 280px"></div><div class="skel" style="height: 280px"></div></div></sc-if>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
        <div class="jobs">
          <sc-for list="{{jobs.list}}" as="j" hint-placeholder-count="3">
            <article class="panel">
              <div class="panel-hd">
                <button class="lnk ro-id" onClick="{{j.open}}">{{j.id}}</button>
                <span class="badge {{j.bcls}}">{{j.status}}</span>
                <sc-if value="{{j.comeback}}" hint-placeholder-val="{{ false }}"><span class="tag tag-red">Comeback</span></sc-if>
                <sc-if value="{{j.hasPri}}" hint-placeholder-val="{{ false }}"><span class="tag {{j.priCls}}">{{j.priority}}</span></sc-if>
                <span class="sp"></span>
                <span class="due {{j.dueCls}}">{{j.due}}</span>
              </div>
              <div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px">
                <div><div style="font-weight: 600; font-size: 14px">{{j.veh}}</div><div class="ro-meta"><span class="plate">{{j.plate}}</span>{{j.miles}}</div></div>
                <dl class="ccc" style="margin: 0"><dt>Concern</dt><dd>{{j.concern}}</dd><dt>Cause</dt><dd>{{j.cause}}</dd><dt>Correction</dt><dd>{{j.correction}}</dd></dl>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <div style="display: flex; font-size: 12px"><span class="muted">Checklist</span><span class="sp"></span><span>{{j.checkText}}</span></div>
                  <span class="meter"><span class="meter-fill {{j.checkCls}}" style="width: {{j.checkPct}}%"></span></span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <div class="muted" style="font-size: 12px">Parts · {{j.hours}} labor booked</div>
                  <sc-for list="{{j.parts}}" as="pl" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span class="mono muted">{{pl.id}}</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{pl.qty}} × {{pl.name}}</span><span class="badge {{pl.bcls}}">{{pl.state}}</span></div></sc-for>
                  <sc-if value="{{j.noParts}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 12px">No parts on this job yet</span></sc-if>
                </div>
              </div>
              <div class="drawer-ft" style="justify-content: flex-start; flex-wrap: wrap">
                <span class="tipwrap" data-tip="{{j.clockTip}}"><button class="btn btn-sm {{j.clockCls}}" disabled="{{j.clockDisabled}}" onClick="{{j.clock}}">{{j.clockLabel}}</button></span>
                <button class="btn btn-sm btn-secondary" onClick="{{j.open}}">Open job: parts, notes, photos</button>
                <span class="sp"></span>
                <span class="tipwrap" data-tip="{{j.qcTip}}"><button class="btn btn-sm btn-secondary" disabled="{{j.qcDisabled}}" onClick="{{j.qc}}">Send to QC</button></span>
              </div>
            </article>
          </sc-for>
        </div>
        <sc-if value="{{jobs.none}}" hint-placeholder-val="{{ false }}"><section class="panel"><div class="empty"><span class="empty-title">No jobs assigned today</span><span>Your service advisor will assign repair orders here.</span></div></section></sc-if>
      </sc-if>
    </sc-if>


  </main>
</div>
</sc-if>
<!-- ============ SUPER ADMIN (separate shell) ============ -->
<sc-if value="{{superShell}}" hint-placeholder-val="{{ false }}">
<nav class="side" aria-label="Platform navigation" style="background: #0F172A; border-right-color: #0F172A">
  <div class="brand" style="color: #FFFFFF"><span class="logo" style="background: #FFFFFF; color: #0F172A"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><circle cx="12" cy="12" r="3.2"/></svg></span><span class="lbl">WrenchOS <span style="font-weight: 500; color: #94A3B8">Platform</span></span></div>
  <div class="nav-group" style="color: #94A3B8">Accounts</div>
  <button class="nav-item {{sa.nav.tenants}}" onClick="{{sa.go.tenants}}" style="color: #CBD5E1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18H4zM9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></svg><span class="lbl">Tenants</span></button>
  <button class="nav-item {{sa.nav.requests}}" onClick="{{sa.go.requests}}" style="color: #CBD5E1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 12v6M9 15h6"/></svg><span class="lbl">Registration requests</span><span class="nav-count" style="color: #FCD34D">{{sa.reqCount}}</span></button>
  <div class="nav-group" style="color: #94A3B8">Billing</div>
  <button class="nav-item {{sa.nav.plans}}" onClick="{{sa.go.plans}}" style="color: #CBD5E1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg><span class="lbl">Plans</span></button>
  <button class="nav-item {{sa.nav.subs}}" onClick="{{sa.go.subs}}" style="color: #CBD5E1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 5h19v14h-19zM2.5 10h19M6 15h4"/></svg><span class="lbl">Subscriptions</span></button>
  <div class="nav-group" style="color: #94A3B8">Operations</div>
  <button class="nav-item {{sa.nav.usage}}" onClick="{{sa.go.usage}}" style="color: #CBD5E1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-7M2 20h20"/></svg><span class="lbl">Usage</span></button>
  <button class="nav-item {{sa.nav.audit}}" onClick="{{sa.go.audit}}" style="color: #CBD5E1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"/></svg><span class="lbl">Audit log</span></button>
  <div class="side-ft" style="color: #94A3B8; font-size: 11px; padding: 12px 8px">Production · US region<br>No access to workshop records</div>
</nav>
<div class="main">
  <header class="topbar" style="background: #FFFFFF">
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><button class="scrim" aria-label="Close menu" onClick="{{closeMenu}}"></button></sc-if>
    <div><div class="eyebrow">Super Admin</div><div style="font-weight: 600">{{sa.title}}</div></div>
    <span class="sp"></span>
    <span class="tag tag-gray">Platform data only</span>
    <button class="btn btn-secondary btn-sm" onClick="{{guide.toggle}}" aria-pressed="{{guide.open}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3zM18 8h2v12M8 9h6M8 13h6"/></svg>Demo guide</button>
    <div class="pop-anchor">
      <button class="role-btn" onClick="{{toggleRoleMenu}}" aria-haspopup="menu" aria-expanded="{{menus.role}}">Viewing as: {{roleLabel}}<svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <sc-if value="{{menus.role}}" hint-placeholder-val="{{ false }}"><div class="menu right" role="menu" style="width: 280px"><div class="menu-label">Prototype · preview a role</div><sc-for list="{{roles}}" as="ro" hint-placeholder-count="4"><button class="menu-item {{ro.cls}}" role="menuitemradio" aria-checked="{{ro.on}}" onClick="{{ro.pick}}"><span><span style="display: block">{{ro.label}}</span><span class="menu-sub">{{ro.sub}}</span></span></button></sc-for></div></sc-if>
    </div>
    <span class="av" style="width: 30px; height: 30px; flex-basis: 30px; background: #0F172A; color: #FFFFFF">NO</span>
  </header>
  <main class="content">
    <sc-if value="{{superSkel}}" hint-placeholder-val="{{ false }}">
      <div aria-busy="true" aria-label="Loading" style="display: flex; flex-direction: column; gap: 16px"><div class="skel" style="height: 12px; width: 180px"></div><div class="skel" style="height: 24px; width: 320px"></div><div class="stat-row"><div class="skel" style="height: 76px"></div><div class="skel" style="height: 76px"></div><div class="skel" style="height: 76px"></div><div class="skel" style="height: 76px"></div></div><div class="split"><div class="panel" style="padding: 16px; gap: 12px"><sc-for list="{{skel8}}" as="s" hint-placeholder-count="8"><div class="skel" style="height: 16px"></div></sc-for></div><div class="skel" style="height: 220px"></div></div></div>
    </sc-if>
    <sc-if value="{{superErr}}" hint-placeholder-val="{{ false }}">
      <section class="panel" role="alert"><div class="empty"><span class="empty-ic" style="background: #FEE2E2; color: #991B1B"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></span><span class="empty-title">This page didn’t load</span><span>The server didn’t respond. Nothing was lost; try again in a moment.</span><button class="btn btn-secondary btn-sm" onClick="{{retry}}" style="margin-top: 6px">Try again</button></div></section>
    </sc-if>

    <sc-if value="{{sv.tenants}}" hint-placeholder-val="{{ true }}">
      <div class="page-hd"><div><div class="eyebrow">Accounts</div><h1 class="h1">Tenants</h1></div></div>
      <div class="banner banner-info"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>You manage accounts, plans and billing here. Customer, vehicle, repair-order and invoice records stay private to each workshop and are never shown in this console.</span></div>
      <div class="kpis"><sc-for list="{{sa.kpis}}" as="k" hint-placeholder-count="4"><div class="kpi" style="cursor: default"><span class="kpi-label">{{k.label}}</span><span class="kpi-value">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for></div>
      <section class="panel">
        <div class="panel-hd" style="gap: 8px"><div class="searchbox" style="width: 260px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Search tenants" placeholder="Workshop, owner or tenant ID" value="{{sa.q}}" onChange="{{sa.onQ}}"></div><sc-for list="{{sa.filters}}" as="f" hint-placeholder-count="5"><button class="chip {{f.cls}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
        <div class="dt" role="table" aria-label="Tenants"><div class="dt-row dt-head" role="row" style="grid-template-columns: 90px minmax(0, 1.5fr) minmax(0, 1fr) 100px 110px 70px 90px 120px 190px; min-width: 1060px"><div class="dt-c" role="columnheader">ID</div><div class="dt-c" role="columnheader">Workshop</div><div class="dt-c" role="columnheader">Owner</div><div class="dt-c" role="columnheader">Plan</div><div class="dt-c" role="columnheader">Status</div><div class="dt-c ta-r" role="columnheader">Users</div><div class="dt-c ta-r" role="columnheader">MRR</div><div class="dt-c" role="columnheader">Since</div><div class="dt-c" role="columnheader"><span class="sr">Actions</span></div></div>
          <div class="dt-body"><sc-for list="{{sa.rows}}" as="tn" hint-placeholder-count="5"><div class="dt-row" role="row" style="grid-template-columns: 90px minmax(0, 1.5fr) minmax(0, 1fr) 100px 110px 70px 90px 120px 190px; min-width: 1060px"><div class="dt-c mono muted" role="cell">{{tn.id}}</div><div class="dt-c" role="cell"><button class="lnk" onClick="{{tn.open}}">{{tn.name}}</button> <span class="muted">· {{tn.region}}</span></div><div class="dt-c muted" role="cell">{{tn.owner}}</div><div class="dt-c" role="cell">{{tn.plan}}</div><div class="dt-c" role="cell"><span class="badge {{tn.bcls}}">{{tn.status}}</span></div><div class="dt-c ta-r" role="cell">{{tn.users}}</div><div class="dt-c ta-r" role="cell">{{tn.mrr}}</div><div class="dt-c muted" role="cell">{{tn.since}}</div><div class="dt-c ta-r" role="cell" style="display: flex; gap: 6px; justify-content: flex-end"><button class="btn btn-xs btn-secondary" onClick="{{tn.open}}">View</button><button class="btn btn-xs {{tn.actCls}}" onClick="{{tn.toggle}}">{{tn.act}}</button></div></div></sc-for></div></div>
        <sc-if value="{{sa.noRows}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-title">No tenants match</span></div></sc-if>
      </section>
    </sc-if>

    <sc-if value="{{sv.tenant}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><button class="lnk" onClick="{{sa.go.tenants}}">Tenants</button><span aria-hidden="true">/</span><span style="color: #101828; font-weight: 500">{{sa.t.name}}</span></div>
      <div class="page-hd" style="align-items: center"><div><div style="display: flex; gap: 8px; align-items: center"><h1 class="h1">{{sa.t.name}}</h1><span class="badge {{sa.t.bcls}}">{{sa.t.status}}</span></div><div class="muted mono" style="font-size: 12px">{{sa.t.id}}</div></div><span class="sp"></span><span class="tipwrap" data-tip="Support access needs the workshop owner’s consent and isn’t enabled"><button class="btn btn-secondary" disabled="{{ true }}">Open workshop data</button></span><button class="btn {{sa.t.actCls}}" onClick="{{sa.t.toggle}}">{{sa.t.act}}</button></div>
      <sc-if value="{{sa.t.hasReason}}" hint-placeholder-val="{{ false }}"><div class="banner banner-error"><span>Suspended: {{sa.t.reason}}</span></div></sc-if>
      <div class="split">
        <div class="stack">
          <section class="panel"><div class="panel-hd"><h2 class="h2">Usage against plan limits</h2></div><div class="panel-bd"><div class="bars-h"><sc-for list="{{sa.t.meters}}" as="mt" hint-placeholder-count="4"><div class="bar-h" style="grid-template-columns: 170px minmax(0, 1fr) 130px"><span>{{mt.label}}</span><span class="track"><span class="fill {{mt.cls}}" style="display: block; width: {{mt.pct}}%"></span></span><span class="ta-r">{{mt.val}}</span></div></sc-for></div></div></section>
          <section class="panel"><div class="panel-hd"><h2 class="h2">Workshop records</h2></div><div class="panel-bd" style="display: flex; gap: 12px; align-items: flex-start"><span class="empty-ic" style="flex: 0 0 40px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><div><div style="font-weight: 600">Private to {{sa.t.name}}</div><div class="muted">Customers, vehicles, estimates, repair orders, invoices and messages are stored in this tenant’s isolated workspace. The platform console only sees the counts above.</div></div></div></section>
          <section class="panel"><div class="panel-hd"><h2 class="h2">Account history</h2></div><div class="panel-bd" style="padding-top: 6px"><div class="tl"><sc-for list="{{sa.t.audit}}" as="ah" hint-placeholder-count="2"><div class="tl-item"><span class="tl-dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg></span><div class="tl-body"><span>{{ah.text}}</span><span class="tl-meta">{{ah.when}} · {{ah.actor}}</span></div></div></sc-for></div><sc-if value="{{sa.t.noAudit}}" hint-placeholder-val="{{ false }}"><span class="hint">No platform actions recorded yet.</span></sc-if></div></section>
        </div>
        <div class="stack">
          <section class="panel"><div class="panel-hd"><h2 class="h2">Account</h2></div><div class="panel-bd"><dl class="kv"><sc-for list="{{sa.t.info}}" as="d" hint-placeholder-count="5"><dt>{{d.k}}</dt><dd>{{d.v}}</dd></sc-for></dl></div></section>
          <section class="panel"><div class="panel-hd"><h2 class="h2">Subscription</h2></div><div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px"><dl class="kv"><sc-for list="{{sa.t.sub}}" as="d" hint-placeholder-count="4"><dt>{{d.k}}</dt><dd>{{d.v}}</dd></sc-for></dl>
            <div style="display: flex; gap: 8px; align-items: flex-end"><div class="field" style="flex: 1"><label class="label" for="sa-plan">Change plan</label><select id="sa-plan" class="select" value="{{sa.t.plan}}" onChange="{{sa.t.onPlan}}"><option value="starter">Starter</option><option value="pro">Pro</option><option value="enterprise">Enterprise</option></select></div><button class="btn btn-primary" disabled="{{sa.t.planDisabled}}" onClick="{{sa.t.savePlan}}">Apply</button></div>
          </div></section>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{sv.requests}}" hint-placeholder-val="{{ false }}">
      <div class="page-hd"><div><div class="eyebrow">Accounts</div><h1 class="h1">Registration requests</h1></div></div>
      <sc-for list="{{sa.reqs}}" as="rq" hint-placeholder-count="2">
        <section class="panel"><div class="panel-hd"><span class="mono muted">{{rq.id}}</span><h2 class="h2">{{rq.shop}}</h2><span class="badge {{rq.bcls}}">{{rq.status}}</span><span class="sp"></span><span class="muted" style="font-size: 12px">{{rq.when}}</span></div>
          <div class="panel-bd" style="display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap"><div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 4px"><span>{{rq.contact}}</span><span class="muted">{{rq.meta}}</span><sc-if value="{{rq.hasNote}}" hint-placeholder-val="{{ false }}"><span class="note" style="margin-top: 6px">{{rq.note}}</span></sc-if><sc-if value="{{rq.hasReason}}" hint-placeholder-val="{{ false }}"><span class="err-text">Reason: {{rq.reason}}</span></sc-if></div>
            <sc-if value="{{rq.pending}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px"><button class="btn btn-danger" onClick="{{rq.reject}}">Reject</button><button class="btn btn-primary" onClick="{{rq.approve}}">Approve and create workspace</button></div></sc-if></div>
        </section>
      </sc-for>
      <sc-if value="{{sa.noReqs}}" hint-placeholder-val="{{ false }}"><section class="panel"><div class="empty"><span class="empty-title">No registration requests</span><span>New sign-ups from the website and sales demos appear here.</span></div></section></sc-if>
    </sc-if>

    <sc-if value="{{sv.plans}}" hint-placeholder-val="{{ false }}">
      <div class="page-hd"><div><div class="eyebrow">Billing</div><h1 class="h1">Plans</h1></div><span class="sp"></span><span class="muted" style="font-size: 12px">0 means unlimited. Changes apply to every tenant on the plan.</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{sa.plans}}" as="pl" hint-placeholder-count="3">
          <section class="panel"><div class="panel-hd"><h2 class="h2" style="font-size: 16px">{{pl.name}}</h2><span class="sp"></span><span class="tag tag-gray">{{pl.tenants}}</span></div><div class="panel-bd" style="display: flex; flex-direction: column; gap: 10px">
            <div class="form-2"><div class="field"><label class="label">Price / month (USD)<input class="input" style="margin-top: 4px" type="number" min="0" value="{{pl.price}}" onChange="{{pl.onPrice}}"></label></div><div class="field"><label class="label">Users<input class="input" style="margin-top: 4px" type="number" min="0" value="{{pl.users}}" onChange="{{pl.onUsers}}"></label></div><div class="field"><label class="label">Branches<input class="input" style="margin-top: 4px" type="number" min="0" value="{{pl.branches}}" onChange="{{pl.onBranches}}"></label></div><div class="field"><label class="label">SMS / month<input class="input" style="margin-top: 4px" type="number" min="0" value="{{pl.sms}}" onChange="{{pl.onSms}}"></label></div></div>
            <ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: #475467"><sc-for list="{{pl.features}}" as="ft" hint-placeholder-count="3"><li>{{ft.f}}</li></sc-for></ul>
            <sc-if value="{{pl.hasErr}}" hint-placeholder-val="{{ false }}"><span class="err-text">{{pl.err}}</span></sc-if>
            <button class="btn btn-primary btn-sm" style="align-self: flex-end" disabled="{{pl.saveDisabled}}" onClick="{{pl.save}}">Save plan</button>
          </div></section>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{sv.subs}}" hint-placeholder-val="{{ false }}">
      <div class="page-hd"><div><div class="eyebrow">Billing</div><h1 class="h1">Subscriptions</h1></div></div>
      <section class="panel"><div class="dt" role="table" aria-label="Subscriptions" style="border-top: 0"><div class="dt-row dt-head" role="row" style="grid-template-columns: minmax(0, 1.5fr) 110px 90px 90px 110px 140px 130px 150px; min-width: 1000px"><div class="dt-c" role="columnheader">Tenant</div><div class="dt-c" role="columnheader">Plan</div><div class="dt-c" role="columnheader">Cycle</div><div class="dt-c ta-r" role="columnheader">MRR</div><div class="dt-c" role="columnheader">Status</div><div class="dt-c" role="columnheader">Next invoice</div><div class="dt-c" role="columnheader">Last payment</div><div class="dt-c" role="columnheader"><span class="sr">Actions</span></div></div>
        <div class="dt-body"><sc-for list="{{sa.subs}}" as="sb" hint-placeholder-count="5"><div class="dt-row" role="row" style="grid-template-columns: minmax(0, 1.5fr) 110px 90px 90px 110px 140px 130px 150px; min-width: 1000px"><div class="dt-c" role="cell"><button class="lnk" onClick="{{sb.open}}">{{sb.name}}</button></div><div class="dt-c" role="cell">{{sb.plan}}</div><div class="dt-c muted" role="cell">{{sb.cycle}}</div><div class="dt-c ta-r" role="cell">{{sb.mrr}}</div><div class="dt-c" role="cell"><span class="badge {{sb.bcls}}">{{sb.status}}</span></div><div class="dt-c muted" role="cell">{{sb.next}}</div><div class="dt-c muted" role="cell">{{sb.last}}</div><div class="dt-c ta-r" role="cell"><sc-if value="{{sb.isPast}}" hint-placeholder-val="{{ false }}"><button class="btn btn-xs btn-primary" onClick="{{sb.retry}}">Retry payment</button></sc-if><sc-if value="{{sb.isTrial}}" hint-placeholder-val="{{ false }}"><button class="btn btn-xs btn-secondary" onClick="{{sb.extend}}">Extend trial 7 days</button></sc-if></div></div></sc-for></div></div></section>
    </sc-if>

    <sc-if value="{{sv.usage}}" hint-placeholder-val="{{ false }}">
      <div class="page-hd"><div><div class="eyebrow">Operations</div><h1 class="h1">Usage</h1></div><span class="sp"></span><span class="muted" style="font-size: 12px">November 2026 · counts only, no record contents</span></div>
      <section class="panel"><div class="dt" role="table" aria-label="Usage by tenant" style="border-top: 0"><div class="dt-row dt-head" role="row" style="grid-template-columns: minmax(0, 1.4fr) 90px 110px minmax(0, 1fr) minmax(0, 1fr) 90px 90px 110px; min-width: 1060px"><div class="dt-c" role="columnheader">Tenant</div><div class="dt-c" role="columnheader">Plan</div><div class="dt-c" role="columnheader">Status</div><div class="dt-c" role="columnheader">Users</div><div class="dt-c" role="columnheader">SMS this month</div><div class="dt-c ta-r" role="columnheader">Branches</div><div class="dt-c ta-r" role="columnheader">ROs</div><div class="dt-c" role="columnheader">Flag</div></div>
        <div class="dt-body"><sc-for list="{{sa.usage}}" as="us" hint-placeholder-count="5"><div class="dt-row" role="row" style="grid-template-columns: minmax(0, 1.4fr) 90px 110px minmax(0, 1fr) minmax(0, 1fr) 90px 90px 110px; min-width: 1060px; height: 52px"><div class="dt-c" role="cell"><button class="lnk" onClick="{{us.open}}">{{us.name}}</button></div><div class="dt-c" role="cell">{{us.plan}}</div><div class="dt-c" role="cell"><span class="badge {{us.bcls}}">{{us.status}}</span></div><div class="dt-c" role="cell" style="display: flex; flex-direction: column; gap: 4px; justify-content: center"><span style="font-size: 12px">{{us.users}}</span><span class="meter"><span class="meter-fill {{us.uCls}}" style="width: {{us.uPct}}%"></span></span></div><div class="dt-c" role="cell" style="display: flex; flex-direction: column; gap: 4px; justify-content: center"><span style="font-size: 12px">{{us.sms}}</span><span class="meter"><span class="meter-fill {{us.sCls}}" style="width: {{us.sPct}}%"></span></span></div><div class="dt-c ta-r" role="cell">{{us.branches}}</div><div class="dt-c ta-r" role="cell">{{us.ros}}</div><div class="dt-c" role="cell"><sc-if value="{{us.hasFlag}}" hint-placeholder-val="{{ false }}"><span class="badge {{us.fCls}}">{{us.flag}}</span></sc-if></div></div></sc-for></div></div></section>
    </sc-if>

    <sc-if value="{{sv.audit}}" hint-placeholder-val="{{ false }}">
      <div class="page-hd"><div><div class="eyebrow">Operations</div><h1 class="h1">Audit log</h1></div><span class="sp"></span><span class="muted" style="font-size: 12px">Every platform action is recorded and can’t be edited</span></div>
      <section class="panel"><div class="panel-hd" style="gap: 8px"><div class="searchbox" style="width: 260px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Search audit log" placeholder="Action, tenant, person" value="{{sa.auQ}}" onChange="{{sa.onAuQ}}"></div><sc-for list="{{sa.auFilters}}" as="f" hint-placeholder-count="6"><button class="chip {{f.cls}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
        <div class="dt" role="table" aria-label="Audit log"><div class="dt-row dt-head" role="row" style="grid-template-columns: 160px 130px 100px 170px minmax(0, 1fr) minmax(0, 1.4fr) 120px; min-width: 1100px"><div class="dt-c" role="columnheader">When</div><div class="dt-c" role="columnheader">Actor</div><div class="dt-c" role="columnheader">Category</div><div class="dt-c" role="columnheader">Action</div><div class="dt-c" role="columnheader">Target</div><div class="dt-c" role="columnheader">Detail</div><div class="dt-c" role="columnheader">IP</div></div>
          <div class="dt-body"><sc-for list="{{sa.audit}}" as="au" hint-placeholder-count="6"><div class="dt-row" role="row" style="grid-template-columns: 160px 130px 100px 170px minmax(0, 1fr) minmax(0, 1.4fr) 120px; min-width: 1100px"><div class="dt-c muted" role="cell">{{au.when}}</div><div class="dt-c" role="cell">{{au.actor}}</div><div class="dt-c" role="cell"><span class="tag tag-gray">{{au.cat}}</span></div><div class="dt-c" role="cell" style="font-weight: 500">{{au.action}}</div><div class="dt-c" role="cell">{{au.target}}</div><div class="dt-c muted" role="cell" title="{{au.detail}}">{{au.detail}}</div><div class="dt-c mono muted" role="cell">{{au.ip}}</div></div></sc-for></div></div>
        <sc-if value="{{sa.noAudit}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No entries match.</span></div></sc-if>
      </section>
    </sc-if>
  </main>
</div>
</sc-if>

<!-- Suspend / reject dialogs -->
<sc-if value="{{sa.susp.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="susp-t"><button class="scrim scrim-dim" aria-label="Close" onClick="{{sa.susp.close}}"></button>
    <div class="modal" style="width: 460px"><div class="modal-hd"><h2 class="h2" id="susp-t" style="font-size: 16px">Suspend {{sa.susp.name}}?</h2></div>
      <div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px"><span>{{sa.susp.users}} Their data is kept and can be restored by reactivating.</span><div class="field"><label class="label" for="susp-r">Reason (sent to the owner and logged)</label><select id="susp-r" class="select" value="{{sa.susp.reason}}" onChange="{{sa.susp.onReason}}"><option value="Non-payment">Non-payment</option><option value="Terms of service violation">Terms of service violation</option><option value="Owner requested a pause">Owner requested a pause</option><option value="Suspected fraud">Suspected fraud</option></select></div></div>
      <div class="modal-ft"><button class="btn btn-ghost" onClick="{{sa.susp.close}}">Cancel</button><button class="btn btn-danger" onClick="{{sa.susp.confirm}}">Suspend account</button></div></div></div>
</sc-if>
<sc-if value="{{sa.rej.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="rej-t"><button class="scrim scrim-dim" aria-label="Close" onClick="{{sa.rej.close}}"></button>
    <div class="modal" style="width: 460px"><div class="modal-hd"><h2 class="h2" id="rej-t" style="font-size: 16px">Reject {{sa.rej.shop}}?</h2></div>
      <div class="panel-bd"><div class="field"><label class="label" for="rej-r">Reason (emailed to the applicant)</label><select id="rej-r" class="select" value="{{sa.rej.reason}}" onChange="{{sa.rej.onReason}}"><option value="Could not verify the business">Could not verify the business</option><option value="Duplicate of an existing tenant">Duplicate of an existing tenant</option><option value="Outside supported regions">Outside supported regions</option><option value="Not an automotive workshop">Not an automotive workshop</option></select></div></div>
      <div class="modal-ft"><button class="btn btn-ghost" onClick="{{sa.rej.close}}">Cancel</button><button class="btn btn-danger" onClick="{{sa.rej.confirm}}">Reject request</button></div></div></div>
</sc-if>

<!-- ============ PRINT VIEW (no app chrome) ============ -->
<sc-if value="{{view.print}}" hint-placeholder-val="{{ false }}">
  <div class="portal-stage">
    <div class="print-bar"><span>Print preview · {{prn.id}}</span><div class="seg" role="group" aria-label="Paper size" style="background: transparent; border-color: #475467"><button class="{{prn.a4On}}" onClick="{{prn.toA4}}" style="color: #FFFFFF">A4</button><button class="{{prn.letterOn}}" onClick="{{prn.toLetter}}" style="color: #FFFFFF">Letter</button></div><button class="btn btn-primary btn-sm" onClick="{{prn.print}}">Print or save as PDF</button><button class="btn btn-secondary btn-sm" onClick="{{prn.back}}">Back to invoice</button></div>
    <div class="sheet {{prn.sheetCls}}">
<div class="doc-hd">
  <div class="doc-brand"><span class="doc-mark" style="background: {{prn.doc.brand}}">{{prn.doc.mark}}</span><div><div style="font-weight: 700; font-size: 15px">{{prn.doc.shop}}</div><div style="color: #475467">{{prn.doc.addr}}</div><div style="color: #475467">{{prn.doc.phone}} · {{prn.doc.email}}</div></div></div>
  <div><div class="doc-title">INVOICE</div><div style="text-align: right; font-weight: 600" class="mono">{{prn.doc.id}}</div><sc-if value="{{prn.doc.isPaid}}" hint-placeholder-val="{{ false }}"><div style="text-align: right; margin-top: 6px"><span class="paid-stamp">PAID</span></div></sc-if><sc-if value="{{prn.doc.isDraft}}" hint-placeholder-val="{{ false }}"><div style="text-align: right; margin-top: 6px"><span class="tag tag-gray">DRAFT</span></div></sc-if></div>
</div>
<div class="doc-grid">
  <div><div class="doc-k">Bill to</div><div style="font-weight: 600">{{prn.doc.cust}}</div><div>{{prn.doc.custAddr}}</div><div style="color: #475467">{{prn.doc.custContact}}</div></div>
  <div><div class="doc-k">Vehicle</div><div style="font-weight: 600">{{prn.doc.veh}}</div><div style="color: #475467">{{prn.doc.vehSub}}</div><div style="color: #475467">Odometer in {{prn.doc.odo}}</div></div>
  <div><div class="doc-k">Invoice details</div><div>Issued: {{prn.doc.issued}}</div><div>Due: {{prn.doc.due}}</div><div>Repair order: <span class="mono">{{prn.doc.ro}}</span> · Tech: {{prn.doc.tech}}</div></div>
</div>
<div>
  <div class="doc-row hd"><span>Item</span><span>Description</span><span class="r">Qty</span><span class="r">Rate</span><span class="r">Amount</span></div>
  <sc-for list="{{prn.doc.groups}}" as="g" hint-placeholder-count="1">
    <div class="doc-row job"><span>{{g.name}}</span></div>
    <sc-for list="{{g.rows}}" as="dr" hint-placeholder-count="2"><div class="doc-row"><span class="mono" style="font-size: 11px">{{dr.kind}}</span><span>{{dr.desc}}</span><span class="r">{{dr.qty}}</span><span class="r">{{dr.rate}}</span><span class="r">{{dr.amt}}</span></div></sc-for>
  </sc-for>
</div>
<div class="doc-tot">
  <span>Labor</span><span>{{prn.doc.labor}}</span>
  <span>Parts</span><span>{{prn.doc.parts}}</span>
  <sc-if value="{{prn.doc.hasDisc}}" hint-placeholder-val="{{ false }}"><span>Discount</span><span>{{prn.doc.disc}}</span></sc-if>
  <span>{{prn.doc.taxLabel}}</span><span>{{prn.doc.tax}}</span>
  <span class="big">Total</span><span class="big">{{prn.doc.total}}</span>
  <sc-for list="{{prn.doc.pays}}" as="dp" hint-placeholder-count="1"><span style="color: #475467">Paid {{dp.text}}</span><span style="color: #15803D">{{dp.amt}}</span></sc-for>
  <span class="big">Balance due</span><span class="big">{{prn.doc.bal}}</span>
</div>
<sc-if value="{{prn.doc.hasDec}}" hint-placeholder-val="{{ false }}"><div style="border: 1px solid #F5D58A; background: #FFFBEB; border-radius: 6px; padding: 8px 10px"><div class="doc-k" style="color: #92400E">Recommended, not yet done</div><sc-for list="{{prn.doc.dec}}" as="dd" hint-placeholder-count="1"><div>{{dd.text}}</div></sc-for></div></sc-if>
<div class="doc-foot"><span>{{prn.doc.terms}}</span><span>{{prn.doc.warranty}}</span><span>Thank you for choosing {{prn.doc.shop}}.</span></div>
    </div>
  </div>
</sc-if>
<!-- ============ CUSTOMER PORTAL (no app chrome) ============ -->
<sc-if value="{{view.portal}}" hint-placeholder-val="{{ false }}">
  <div class="portal-stage">
    <div class="proto-bar" role="note"><span>Customer view · what {{pt.custName}} sees at <span class="mono">{{pt.link}}</span></span><button class="btn btn-secondary" onClick="{{pt.exit}}">Back to WrenchOS</button></div>
    <div class="phone" role="main" aria-label="Customer approval portal">
      <div class="p-scroll">
        <div class="p-brand" style="background: {{pt.brand}}">
          <span class="p-mark">{{pt.mark}}</span>
          <div style="min-width: 0"><div style="font-weight: 700; font-size: 16px">{{pt.shop}}</div><div style="font-size: 12px; opacity: .85">{{pt.shopSub}}</div></div>
        </div>

        <!-- Step 1: review -->
        <sc-if value="{{pt.isReview}}" hint-placeholder-val="{{ true }}">
          <div class="p-body">
            <div><div style="font-size: 20px; font-weight: 700; letter-spacing: -.01em">Hi {{pt.first}},</div><div style="color: #475467; margin-top: 4px">{{pt.intro}}</div></div>
            <div class="p-card" style="background: #F9FAFB"><div class="p-line"><span>Vehicle</span><strong style="color: #101828">{{pt.vehName}}</strong></div><div class="p-line"><span>Plate</span><span class="plate">{{pt.plate}}</span></div><div class="p-line"><span>Estimate</span><span>{{pt.id}} · {{pt.ver}} · {{pt.sentWhen}}</span></div></div>
            <sc-if value="{{pt.hasNote}}" hint-placeholder-val="{{ false }}"><div class="p-card"><span style="font-size: 12px; font-weight: 600; color: #475467">Note from your service advisor</span><span>{{pt.note}}</span></div></sc-if>
            <sc-for list="{{pt.jobs}}" as="pj" hint-placeholder-count="2">
              <div class="p-card {{pj.cls}}">
                <div style="display: flex; align-items: flex-start; gap: 8px"><div style="flex: 1"><div style="font-size: 11px; font-weight: 700; color: #5B6474; letter-spacing: .05em; text-transform: uppercase">{{pj.no}}</div><div style="font-weight: 700; font-size: 16px">{{pj.name}}</div></div><div style="font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums">{{pj.price}}</div></div>
                <sc-for list="{{pj.items}}" as="pi" hint-placeholder-count="2"><div class="p-line"><span>{{pi.label}}</span><span style="font-variant-numeric: tabular-nums">{{pi.amt}}</span></div></sc-for>
                <div class="p-choice"><button class="p-btn {{pj.okCls}}" aria-pressed="{{pj.okPressed}}" aria-label="{{pj.okAria}}" onClick="{{pj.approve}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Approve</button><button class="p-btn {{pj.noCls}}" aria-pressed="{{pj.noPressed}}" aria-label="{{pj.noAria}}" onClick="{{pj.decline}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Decline</button></div>
              </div>
            </sc-for>
            <div style="font-size: 12px; color: #5B6474; text-align: center">Prices before tax. Declined work is saved so you can book it later.</div>
          </div>
        </sc-if>

        <!-- Step 2: sign -->
        <sc-if value="{{pt.isSign}}" hint-placeholder-val="{{ false }}">
          <div class="p-body">
            <button class="p-ghost" style="justify-content: flex-start; height: 28px; width: auto" onClick="{{pt.back}}">← Change my choices</button>
            <div style="font-size: 20px; font-weight: 700">Review and sign</div>
            <div class="p-card"><div class="p-line"><span>Approved</span><strong style="color: #15803D; text-align: right">{{pt.approvedNames}}</strong></div><div class="p-line"><span>Declined</span><span style="text-align: right">{{pt.declinedNames}}</span></div><div class="p-line" style="border-top: 1px solid #E4E7EC; padding-top: 8px; color: #101828; font-weight: 700; font-size: 15px"><span>You'll pay</span><span>{{pt.approvedTotal}}</span></div><div class="hint">{{pt.taxNote}}</div></div>
            <div class="field"><label class="label" for="p-name" style="font-size: 13px">Full name</label><input id="p-name" class="input" style="height: 44px; font-size: 15px" autocomplete="name" placeholder="{{pt.custName}}" value="{{pt.name}}" onChange="{{pt.onName}}"></div>
            <div class="field">
              <div style="display: flex; align-items: center; gap: 8px"><span class="label" style="font-size: 13px">Signature</span><span class="sp"></span><div class="seg" role="group" aria-label="Signature method"><button class="{{pt.drawOn}}" onClick="{{pt.toDraw}}">Draw</button><button class="{{pt.typeOn}}" onClick="{{pt.toType}}">Type</button></div></div>
              <sc-if value="{{pt.isDraw}}" hint-placeholder-val="{{ true }}">
                <svg class="sig" viewBox="0 0 326 140" preserveAspectRatio="none" role="img" aria-label="Signature pad. Draw with your finger or mouse, or switch to Type." onPointerDown="{{pt.down}}" onPointerMove="{{pt.move}}" onPointerUp="{{pt.up}}" onPointerLeave="{{pt.up}}"><path d="M16 112 H310" stroke="#D0D5DD" stroke-width="1" stroke-dasharray="4 4" fill="none"/><path d="{{pt.sigD}}" fill="none" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div style="display: flex; justify-content: space-between" class="hint"><span>Sign above the line</span><button class="lnk" style="font-size: 12px" onClick="{{pt.clearSig}}">Clear</button></div>
              </sc-if>
              <sc-if value="{{pt.isType}}" hint-placeholder-val="{{ false }}"><div class="sig-typed" aria-label="Typed signature preview">{{pt.typedSig}}</div><span class="hint">Your typed name is used as your signature.</span></sc-if>
            </div>
            <label class="check"><input type="checkbox" checked="{{pt.agree}}" onChange="{{pt.onAgree}}"><span>{{pt.authText}}</span></label>
          </div>
        </sc-if>

        <!-- Step 3: done -->
        <sc-if value="{{pt.isDone}}" hint-placeholder-val="{{ false }}">
          <div class="p-body" style="align-items: stretch">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 12px 0"><span style="width: 56px; height: 56px; border-radius: 50%; background: #DCFCE7; color: #15803D; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 2.4"><path d="M5 12l5 5 9-10"/></svg></span><div style="font-size: 20px; font-weight: 700">{{pt.doneTitle}}</div><div style="color: #475467">{{pt.doneText}}</div></div>
            <div class="p-card">
              <sc-for list="{{pt.doneJobs}}" as="dj" hint-placeholder-count="2"><div class="p-line" style="align-items: center"><span style="color: #101828; font-weight: 500">{{dj.name}}</span><span style="display: flex; gap: 8px; align-items: center"><span>{{dj.price}}</span><span class="badge {{dj.bcls}}">{{dj.status}}</span></span></div></sc-for>
              <div class="p-line" style="border-top: 1px solid #E4E7EC; padding-top: 8px; color: #101828; font-weight: 700"><span>Approved total</span><span>{{pt.doneTotal}}</span></div>
            </div>
            <sc-if value="{{pt.hasSignature}}" hint-placeholder-val="{{ true }}">
              <div class="p-card"><span style="font-size: 12px; font-weight: 600; color: #475467">Signed</span>
                <sc-if value="{{pt.signedDrawn}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 326 140" role="img" aria-label="Your signature" style="width: 100%; height: 100px"><path d="{{pt.signedD}}" fill="none" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if>
                <sc-if value="{{pt.signedTyped}}" hint-placeholder-val="{{ false }}"><div class="sig-typed" style="height: 80px; font-size: 26px; border: 0">{{pt.signedAs}}</div></sc-if>
                <span class="hint">{{pt.signedAs}} · {{pt.signedWhen}}</span>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{pt.isReview}}" hint-placeholder-val="{{ true }}">
        <div class="p-foot">
          <div style="display: flex; justify-content: space-between; font-size: 13px; color: #475467"><span>{{pt.progress}}</span><span>Approved: <strong style="color: #101828">{{pt.approvedTotal}}</strong></span></div>
          <button class="p-primary" style="background: {{pt.brand}}" disabled="{{pt.contDisabled}}" onClick="{{pt.cont}}">Continue to sign</button>
          <sc-if value="{{pt.contDisabled}}" hint-placeholder-val="{{ true }}"><span class="hint" style="text-align: center">{{pt.contHint}}</span></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{pt.isSign}}" hint-placeholder-val="{{ false }}">
        <div class="p-foot">
          <button class="p-primary" style="background: {{pt.brand}}" disabled="{{pt.submitDisabled}}" onClick="{{pt.submit}}">Submit my decision</button>
          <sc-if value="{{pt.submitDisabled}}" hint-placeholder-val="{{ true }}"><span class="hint" style="text-align: center">{{pt.submitHint}}</span></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{pt.powered}}" hint-placeholder-val="{{ true }}"><div style="text-align: center; font-size: 11px; color: #5B6474; padding: 6px 0 10px; border-top: 1px solid #F0F2F5">Secured by WrenchOS</div></sc-if>
    </div>
  </div>
</sc-if>

<!-- Record payment -->
<sc-if value="{{pay.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="pay-title">
    <button class="scrim scrim-dim" aria-label="Close" onClick="{{pay.close}}"></button>
    <div class="modal" style="width: 480px">
      <div class="modal-hd"><div><h2 class="h2" id="pay-title" style="font-size: 16px">Record payment on {{pay.id}}</h2><div class="hint">Invoice total {{pay.total}} · balance {{pay.bal}}</div></div><span class="sp"></span><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close" onClick="{{pay.close}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="panel-bd" style="display: flex; flex-direction: column; gap: 14px">
        <div class="field"><span class="label">Method</span><div class="seg" role="group" aria-label="Payment method"><sc-for list="{{pay.methods}}" as="pm" hint-placeholder-count="3"><button class="{{pm.cls}}" onClick="{{pm.pick}}">{{pm.label}}</button></sc-for></div></div>
        <div class="field"><label class="label" for="pay-amt">Amount</label><div style="display: flex; gap: 6px"><input id="pay-amt" class="input" style="flex: 1; font-size: 16px; font-weight: 600" type="number" min="0" step="0.01" value="{{pay.amount}}" onChange="{{pay.onAmount}}"><button class="btn btn-secondary btn-sm" style="height: 32px" onClick="{{pay.half}}">Half</button><button class="btn btn-secondary btn-sm" style="height: 32px" onClick="{{pay.full}}">Full balance</button></div><span class="hint">{{pay.after}}</span></div>
        <sc-if value="{{pay.isCash}}" hint-placeholder-val="{{ false }}"><div class="field"><label class="label" for="pay-tend">Cash tendered (optional)</label><input id="pay-tend" class="input" type="number" min="0" step="0.01" value="{{pay.tendered}}" onChange="{{pay.onTend}}"><sc-if value="{{pay.hasChange}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; color: #166534">{{pay.change}}</span></sc-if></div></sc-if>
        <sc-if value="{{pay.isCard}}" hint-placeholder-val="{{ true }}"><div class="field"><label class="label" for="pay-card">Card last 4 digits (optional)</label><input id="pay-card" class="input mono" maxlength="4" inputmode="numeric" placeholder="4242" value="{{pay.ref}}" onChange="{{pay.onRef}}"></div></sc-if>
        <sc-if value="{{pay.isBank}}" hint-placeholder-val="{{ false }}"><div class="field"><label class="label" for="pay-ref">Transfer reference (optional)</label><input id="pay-ref" class="input mono" placeholder="e.g. TRX-88231" value="{{pay.ref}}" onChange="{{pay.onRef}}"></div></sc-if>
        <sc-if value="{{pay.hasErr}}" hint-placeholder-val="{{ false }}"><span class="err-text" role="alert">{{pay.err}}</span></sc-if>
      </div>
      <div class="modal-ft"><button class="btn btn-ghost" onClick="{{pay.close}}">Cancel</button><button class="btn btn-primary" disabled="{{pay.saveDisabled}}" onClick="{{pay.save}}">Record payment</button></div>
    </div>
  </div>
</sc-if>
<!-- Receipt -->
<sc-if value="{{rc.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="rc-title">
    <button class="scrim scrim-dim" aria-label="Close" onClick="{{rc.close}}"></button>
    <div class="modal" style="width: 380px">
      <div style="background: {{rc.brand}}; color: #FFFFFF; padding: 16px; display: flex; gap: 10px; align-items: center; border-radius: 12px 12px 0 0"><span class="p-mark">{{rc.mark}}</span><div><div style="font-weight: 700">{{rc.shop}}</div><div style="font-size: 12px; opacity: .85">{{rc.shopSub}}</div></div></div>
      <div class="panel-bd" style="display: flex; flex-direction: column; gap: 10px">
        <div style="text-align: center"><div class="kpi-label" id="rc-title">Payment receipt</div><div style="font-size: 26px; font-weight: 700">{{rc.amount}}</div><div class="hint mono">{{rc.rcpt}} · {{rc.when}}</div></div>
        <dl class="kv"><dt>Customer</dt><dd>{{rc.cust}}</dd><dt>Invoice</dt><dd class="mono">{{rc.inv}}</dd><dt>Method</dt><dd>{{rc.method}}</dd><dt>Invoice total</dt><dd>{{rc.total}}</dd><dt>Paid to date</dt><dd>{{rc.paidToDate}}</dd><dt>Balance</dt><dd style="font-weight: 600">{{rc.bal}}</dd><dt>Received by</dt><dd>{{rc.by}}</dd></dl>
        <span class="hint">A copy was sent to the customer automatically.</span>
      </div>
      <div class="modal-ft"><button class="btn btn-primary" onClick="{{rc.close}}">Done</button></div>
    </div>
  </div>
</sc-if>

<!-- Reorder low stock -->
<sc-if value="{{rm.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="rm-title">
    <button class="scrim scrim-dim" aria-label="Close" onClick="{{rm.close}}"></button>
    <div class="modal" style="width: 920px">
      <div class="modal-hd"><div><h2 class="h2" id="rm-title" style="font-size: 16px">Reorder low-stock parts</h2><div class="hint">Suggested quantities bring each part back to twice its reorder point, minus anything already on order. One draft PO is created per supplier.</div></div><span class="sp"></span><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close" onClick="{{rm.close}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="ln-wrap">
        <div class="pl pl-head" style="grid-template-columns: 32px minmax(180px, 1fr) minmax(120px, .8fr) 70px 70px 90px 80px 80px 90px; min-width: 860px"><span></span><span>Part</span><span>Supplier</span><span class="num">Avail.</span><span class="num">Reorder</span><span class="num">On order</span><span class="num">Suggest</span><span>Order qty</span><span class="num">Line total</span></div>
        <sc-for list="{{rm.rows}}" as="r" hint-placeholder-count="6">
          <div class="pl" style="grid-template-columns: 32px minmax(180px, 1fr) minmax(120px, .8fr) 70px 70px 90px 80px 80px 90px; min-width: 860px">
            <span><input type="checkbox" style="width: 16px; height: 16px; accent-color: #1E40AF" aria-label="{{r.aria}}" checked="{{r.checked}}" onChange="{{r.toggle}}"></span>
            <span style="min-width: 0; display: flex; flex-direction: column"><span class="ellip" style="font-weight: 500">{{r.name}}</span><span class="hint mono" style="font-size: 11px">{{r.id}} · {{r.cost}} each</span></span>
            <span class="ellip muted">{{r.sup}}</span>
            <span class="num" style="color: #991B1B; font-weight: 600">{{r.avail}}</span>
            <span class="num">{{r.reorder}}</span>
            <span class="num muted">{{r.onOrder}}</span>
            <span class="num muted">{{r.suggest}}</span>
            <span><input class="input input-sm num" style="width: 70px" type="number" min="0" step="1" aria-label="{{r.qAria}}" value="{{r.qty}}" onChange="{{r.onQty}}"></span>
            <span class="num">{{r.total}}</span>
          </div>
        </sc-for>
      </div>
      <div class="modal-ft" style="justify-content: flex-start; flex-wrap: wrap">
        <sc-for list="{{rm.groups}}" as="g" hint-placeholder-count="2"><span class="chip on" style="cursor: default">{{g.name}} · {{g.sub}}</span></sc-for>
        <span class="sp"></span>
        <button class="btn btn-ghost" onClick="{{rm.close}}">Cancel</button>
        <span class="tipwrap" data-tip="{{rm.createTip}}"><button class="btn btn-primary" disabled="{{rm.createDisabled}}" onClick="{{rm.create}}">{{rm.createLabel}}</button></span>
      </div>
    </div>
  </div>
</sc-if>

<!-- Convert estimate to RO -->
<sc-if value="{{cv.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="cv-title">
    <button class="scrim scrim-dim" aria-label="Close" onClick="{{cv.close}}"></button>
    <div class="modal" style="width: 640px">
      <div class="modal-hd"><div><h2 class="h2" id="cv-title" style="font-size: 16px">Create repair order from {{cv.id}} {{cv.ver}}</h2><div class="hint">Only approved work is included. Reserved parts move to the RO.</div></div><span class="sp"></span><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close" onClick="{{cv.close}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="panel-bd" style="display: flex; flex-direction: column; gap: 14px">
        <sc-if value="{{cv.hasErr}}" hint-placeholder-val="{{ false }}"><div class="banner banner-error" role="alert"><span>{{cv.err}}</span></div></sc-if>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span class="label">Included</span>
          <sc-for list="{{cv.inc}}" as="ij" hint-placeholder-count="1"><div style="display: flex; gap: 8px; align-items: flex-start"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #15803D; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg><span><strong style="font-weight: 600">{{ij.name}}</strong><span class="hint" style="display: block">{{ij.sub}}</span></span></div></sc-for>
          <sc-if value="{{cv.hasExc}}" hint-placeholder-val="{{ false }}"><span class="label" style="margin-top: 6px">Not included</span><sc-for list="{{cv.exc}}" as="xj" hint-placeholder-count="1"><div style="display: flex; gap: 8px; align-items: flex-start; color: #5B6474"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px"><path d="M6 6l12 12M18 6L6 18"/></svg><span><span style="text-decoration: line-through">{{xj.name}}</span><span class="hint" style="display: block">{{xj.sub}}</span></span></div></sc-for></sc-if>
        </div>
        <div class="form-2">
          <div class="field"><label class="label" for="cv-num">RO number</label><input id="cv-num" class="input mono" value="{{cv.num}}" onChange="{{cv.onNum}}"></div>
          <div class="field"><label class="label" for="cv-mi">Odometer in (mi)</label><input id="cv-mi" class="input" inputmode="numeric" value="{{cv.mi}}" onChange="{{cv.onMi}}"></div>
        </div>
        <div class="field"><span class="label" id="cv-tech-l">Assign technician</span><div class="pick-grid" role="radiogroup" aria-labelledby="cv-tech-l"><sc-for list="{{cv.techs}}" as="tp" hint-placeholder-count="4"><button class="pick {{tp.cls}}" role="radio" aria-checked="{{tp.on}}" onClick="{{tp.pick}}"><span style="font-weight: 500">{{tp.label}}</span><span class="hint">{{tp.sub}}</span></button></sc-for></div></div>
        <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end">
          <div class="field"><span class="label">Priority</span><div class="seg" role="group" aria-label="Priority"><sc-for list="{{cv.pris}}" as="pp" hint-placeholder-count="3"><button class="{{pp.cls}}" onClick="{{pp.pick}}">{{pp.label}}</button></sc-for></div></div>
          <div class="field"><label class="label" for="cv-date">Promised date</label><input id="cv-date" class="input" type="date" value="{{cv.date}}" onChange="{{cv.onDate}}"></div>
          <div class="field"><label class="label" for="cv-time">Promised time</label><select id="cv-time" class="select" value="{{cv.time}}" onChange="{{cv.onTime}}"><option value="09:00">9:00 AM</option><option value="10:00">10:00 AM</option><option value="11:00">11:00 AM</option><option value="12:00">12:00 PM</option><option value="13:00">1:00 PM</option><option value="14:00">2:00 PM</option><option value="15:00">3:00 PM</option><option value="16:00">4:00 PM</option><option value="16:30">4:30 PM</option><option value="17:00">5:00 PM</option><option value="17:30">5:30 PM</option><option value="18:00">6:00 PM</option></select></div>
        </div>
      </div>
      <div class="modal-ft"><button class="btn btn-ghost" onClick="{{cv.close}}">Cancel</button><button class="btn btn-primary" onClick="{{cv.create}}">Create repair order</button></div>
    </div>
  </div>
</sc-if>

<!-- Send-for-approval preview -->
<sc-if value="{{sm.open}}" hint-placeholder-val="{{ false }}">
  <div class="ovc" role="dialog" aria-modal="true" aria-labelledby="sm-title">
    <button class="scrim scrim-dim" aria-label="Close preview" onClick="{{sm.close}}"></button>
    <div class="modal">
      <div class="modal-hd"><div><h2 class="h2" id="sm-title" style="font-size: 16px">Send {{sm.id}} {{sm.ver}} for approval</h2><div class="hint">To {{sm.to}} · {{sm.pref}}</div></div><span class="sp"></span><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close" onClick="{{sm.close}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="panel-bd" style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span class="label">Send by</span><div class="seg" role="group" aria-label="Channel"><button class="{{sm.smsOn}}" onClick="{{sm.pickSms}}">SMS</button><button class="{{sm.emailOn}}" onClick="{{sm.pickEmail}}">Email</button><button class="{{sm.bothOn}}" onClick="{{sm.pickBoth}}">SMS + email</button></div></div>
        <div class="prev-grid">
          <div class="{{sm.smsCls}}" style="display: flex; flex-direction: column; gap: 6px">
            <span class="kpi-label">SMS to {{sm.phone}}</span>
            <div class="sms-prev"><span class="hint" style="text-align: center">Today</span><div class="sms-bub">{{sm.sms}}</div></div>
          </div>
          <div class="{{sm.emailCls}}" style="display: flex; flex-direction: column; gap: 6px">
            <span class="kpi-label">Email to {{sm.email}}</span>
            <div class="mail-prev">
              <div class="mail-hd"><span><strong>From:</strong> {{sm.from}}</span><span><strong>Subject:</strong> {{sm.subject}}</span></div>
              <div class="mail-bd">
                <span>Hi {{sm.first}},</span>
                <span>Your estimate for the {{sm.vehName}} is ready. Approve the jobs you want and decline the rest; you only pay for what you approve.</span>
                <sc-if value="{{sm.hasNote}}" hint-placeholder-val="{{ false }}"><span style="padding: 8px 10px; background: #F9FAFB; border-radius: 6px">{{sm.note}}</span></sc-if>
                <div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #E4E7EC; padding-top: 8px"><sc-for list="{{sm.jobs}}" as="jb" hint-placeholder-count="2"><span style="display: flex; justify-content: space-between; gap: 10px"><span>{{jb.name}}</span><span style="font-variant-numeric: tabular-nums">{{jb.amt}}</span></span></sc-for><span style="display: flex; justify-content: space-between; font-weight: 600; border-top: 1px solid #E4E7EC; padding-top: 6px"><span>Total incl. tax</span><span>{{sm.total}}</span></span></div>
                <span class="mail-btn" style="background: {{sm.brand}}">Review &amp; approve</span>
                <span class="hint">Or open {{sm.link}}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-ft"><span class="hint" style="margin-right: auto">The message is logged in Communications and the estimate moves to Sent.</span><button class="btn btn-ghost" onClick="{{sm.close}}">Cancel</button><button class="btn btn-primary" onClick="{{sm.send}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Send {{sm.chLabel}}</button></div>
    </div>
  </div>
</sc-if>

<!-- Appointment drawer -->
<sc-if value="{{dw.open}}" hint-placeholder-val="{{ false }}">
  <div class="ov" role="dialog" aria-modal="true" aria-labelledby="dw-title">
    <button class="scrim scrim-dim" aria-label="Close appointment panel" onClick="{{dw.close}}"></button>
    <div class="ov-panel">
      <div class="drawer-hd"><h2 class="h2" id="dw-title" style="font-size: 16px">{{dw.title}}</h2><span class="sp"></span><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close" onClick="{{dw.close}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="ov-body">
        <sc-if value="{{dw.hasErr}}" hint-placeholder-val="{{ false }}"><div class="banner banner-error" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>{{dw.err}}</span></div></sc-if>
