                      <div class="dt-c" role="cell"><span class="badge {{p.bcls}}">{{p.status}}</span></div>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{noLow}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span class="empty-title">All parts above reorder point</span><span>Parts that dip below their reorder level will appear here.</span></div></sc-if>
          </section>

          <!-- Activity -->
          <section class="panel" aria-labelledby="act-h">
            <div class="panel-hd"><h2 class="h2" id="act-h">Recent activity</h2></div>
            <div class="panel-bd" style="padding-top: 8px; padding-bottom: 8px; max-height: 392px; overflow: auto">
              <div class="tl">
                <sc-for list="{{activity}}" as="a" hint-placeholder-count="6">
                  <div class="tl-item">
                    <span class="tl-dot {{a.kcls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{a.icon}}"></path></svg></span>
                    <div class="tl-body">
                      <span><strong style="font-weight: 600">{{a.who}}</strong> {{a.text}} <button class="lnk mono" onClick="{{a.open}}">{{a.ref}}</button>{{a.tail}}</span>
                      <span class="tl-meta">{{a.when}}</span>
                    </div>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{noActivity}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-title">No activity yet</span><span>Approvals, payments and job updates show up here as they happen.</span></div></sc-if>
            </div>
          </section>
        </div>
      </sc-if>
    </sc-if>

    <!-- ============ LIST (destination of dashboard links) ============ -->
    <sc-if value="{{view.list}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="2"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd">
        <h1 class="h1">{{list.title}}</h1>
        <span class="muted">{{list.countLabel}}</span>
        <span class="sp"></span>
        <sc-if value="{{list.hasExtra}}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{list.extraRun}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/></svg>{{list.extraLabel}}</button></sc-if>
        <sc-if value="{{list.canNew}}" hint-placeholder-val="{{ true }}"><button class="btn btn-primary" onClick="{{list.onNew}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{list.newLabel}}</button></sc-if>
      </div>
      <section class="panel">
        <div class="panel-hd" style="gap: 8px">
          <div class="searchbox" style="width: 280px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input class="input" type="search" aria-label="Search this list" placeholder="{{list.searchPh}}" value="{{listQ}}" onChange="{{onListQ}}"></div>
          <sc-for list="{{list.quick}}" as="qf" hint-placeholder-count="3"><button class="chip {{qf.cls}}" onClick="{{qf.pick}}" aria-pressed="{{qf.on}}">{{qf.label}}</button></sc-for>
          <sc-if value="{{list.hasFilter}}" hint-placeholder-val="{{ false }}"><span class="chip on">{{list.filterLabel}}<button class="x" onClick="{{list.clear}}" aria-label="Clear filter"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-if>
        </div>
        <sc-if value="{{list.loading}}" hint-placeholder-val="{{ false }}">

      </section>
    </sc-if>

    <!-- ============ RECORD (detail stub) ============ -->
    <sc-if value="{{view.record}}" hint-placeholder-val="{{ false }}">

      <div class="page-hd">
        <div><h1 class="h1">{{rec.title}}</h1><div class="muted">{{rec.subtitle}}</div></div>

            <sc-for list="{{rec.partLines}}" as="pl" hint-placeholder-count="2"><div class="li"><span class="mono muted" style="min-width: 70px">{{pl.id}}</span><span class="ellip" style="flex: 1">{{pl.qty}} × {{pl.name}}</span><span class="badge {{pl.bcls}}">{{pl.state}}</span></div></sc-for>

      <sc-if value="{{rec.hasPhase}}" hint-placeholder-val="{{ false }}"><div class="phase">{{rec.phase}}</div></sc-if>

    <!-- ============ CUSTOMER PROFILE ============ -->

      <div class="prof-hd">
        <span class="prof-av" aria-hidden="true">{{cp.ini}}</span>
        <div style="min-width: 0">
          <h1 class="h1">{{cp.name}}</h1>
          <div class="muted" style="font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap"><span class="mono">{{cp.id}}</span><span>· Customer since {{cp.since}}</span><span>· Prefers {{cp.pref}}</span><sc-if value="{{cp.hasTag}}" hint-placeholder-val="{{ false }}"><span class="tag tag-gray">{{cp.tag}}</span></sc-if></div>

        <span class="sp"></span>
        <button class="btn btn-secondary" onClick="{{cp.message}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12z"/></svg>Send message</button>
        <button class="btn btn-secondary" onClick="{{cp.newEstimate}}">New estimate</button>
        <button class="btn btn-primary" onClick="{{cp.book}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Book appointment</button>
      </div>
      <div class="stat-row">
        <sc-for list="{{cp.stats}}" as="k" hint-placeholder-count="4"><div class="stat"><span class="kpi-label">{{k.label}}</span><span class="stat-v">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for>

      <div class="tabs" role="tablist" aria-label="Customer sections">

      <!-- Overview -->
      <sc-if value="{{cp.tab.overview}}" hint-placeholder-val="{{ true }}">

          <div class="stack">
            <section class="panel">

              <div class="panel-bd">
                <div class="veh-cards">
                  <sc-for list="{{cp.vehicles}}" as="v" hint-placeholder-count="2">
                    <button class="veh-card" onClick="{{v.open}}" aria-label="{{v.aria}}">

                      <span class="mono muted" style="font-size: 11px">VIN {{v.vin}}</span>
                      <span style="display: flex; gap: 14px; font-size: 12px; color: #475467"><span>{{v.miles}}</span><span>Last visit {{v.last}}</span></span>
                      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap"><span class="badge {{v.nsCls}}">{{v.nsStatus}}</span><span class="muted">{{v.nsText}}</span></span>
                      <sc-if value="{{v.hasOpen}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #1E40AF; font-weight: 500">In the shop: {{v.openText}}</span></sc-if>

                </div>
                <sc-if value="{{cp.noVehicles}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span class="empty-title">No vehicles on file</span><span>Add a vehicle to book work against it.</span></div></sc-if>
              </div>
            </section>
            <section class="panel">
              <div class="panel-hd"><h2 class="h2">Open work</h2></div>
              <sc-for list="{{cp.openWork}}" as="w" hint-placeholder-count="2">
                <button class="li-btn" onClick="{{w.open}}"><span class="mono" style="color: #1E40AF; min-width: 74px">{{w.id}}</span><span class="ellip" style="flex: 1">{{w.title}}</span><span class="badge {{w.bcls}}">{{w.badge}}</span></button>

                  <span style="font-variant-numeric: tabular-nums; font-weight: 500">{{d.amount}}</span>
                  <span class="badge {{d.bcls}}">{{d.status}}</span>
                  <sc-if value="{{d.canAct}}" hint-placeholder-val="{{ true }}"><button class="btn btn-xs btn-secondary" onClick="{{d.follow}}">Send follow-up</button><button class="btn btn-xs btn-primary" onClick="{{d.book}}">Book</button></sc-if>
                </div>
              </sc-for>
              <sc-if value="{{cp.noDeclined}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No declined recommendations.</span></div></sc-if>

          <div class="stack">

            <section class="panel">
              <div class="panel-hd"><h2 class="h2">Pinned notes</h2><span class="sp"></span><button class="btn btn-ghost btn-sm" onClick="{{cp.allNotes}}">All notes</button></div>

                <sc-for list="{{cp.pinned}}" as="n" hint-placeholder-count="1"><div class="note pinned"><span>{{n.text}}</span><span class="muted" style="font-size: 12px">{{n.meta}}</span></div></sc-for>
                <sc-if value="{{cp.noPinned}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 12px">Nothing pinned. Pin a note from the Notes tab.</span></sc-if>
              </div>
            </section>
            <section class="panel">
              <div class="panel-hd"><h2 class="h2">Recent messages</h2><span class="sp"></span><button class="btn btn-ghost btn-sm" onClick="{{cp.allMsgs}}">Open thread</button></div>

              <sc-if value="{{cp.noRecent}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No messages yet.</span></div></sc-if>

      <!-- Vehicles tab -->
      <sc-if value="{{cp.tab.vehicles}}" hint-placeholder-val="{{ false }}">

              <span class="mono muted" style="font-size: 11px">VIN {{v.vin}}</span>
              <span style="display: flex; gap: 14px; font-size: 12px; color: #475467"><span>{{v.miles}}</span><span>Last visit {{v.last}}</span></span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap"><span class="badge {{v.nsCls}}">{{v.nsStatus}}</span><span class="muted">{{v.nsText}}</span></span>
              <sc-if value="{{v.hasOpen}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #1E40AF; font-weight: 500">In the shop: {{v.openText}}</span></sc-if>
              <sc-if value="{{v.hasDeclined}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #92400E">{{v.declinedText}}</span></sc-if>

            </button>

        </div>
        <sc-if value="{{cp.noVehicles}}" hint-placeholder-val="{{ false }}"><section class="panel"><div class="empty"><span class="empty-title">No vehicles on file</span></div></section></sc-if>

      <!-- Estimates / ROs / Invoices tabs -->

      <!-- Notes tab -->

        <span class="sp"></span>

        <button class="btn btn-primary" onClick="{{vp.book}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Book appointment</button>
      </div>
      <div class="stat-row">
        <sc-for list="{{vp.stats}}" as="k" hint-placeholder-count="4"><div class="stat"><span class="kpi-label">{{k.label}}</span><span class="stat-v">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for>

      <div class="split">

            <div class="tl">
              <sc-for list="{{vp.timeline}}" as="e" hint-placeholder-count="5">
                <div class="tl-item">
                  <span class="tl-dot {{e.kcls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"/></svg></span>
                  <div class="svc-card">
                    <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span class="muted" style="font-size: 12px; min-width: 92px">{{e.date}}</span><span class="mono" style="font-weight: 600">{{e.title}}</span><span class="badge {{e.bcls}}">{{e.badge}}</span><span class="sp"></span><button class="lnk" onClick="{{e.open}}">{{e.link}}</button></span>
                    <span style="font-weight: 500">{{e.l1}}</span>
                    <sc-if value="{{e.hasL2}}" hint-placeholder-val="{{ false }}"><span style="color: #475467">{{e.l2}}</span></sc-if>
                    <span class="muted" style="font-size: 12px">{{e.meta}}</span>
                  </div>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{vp.noTimeline}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-title">No service history yet</span><span>Visits, estimates and declined work will build up here.</span></div></sc-if>
          </div>
        </section>
        <div class="stack">
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Next service due</h2><span class="sp"></span><span class="badge {{vp.ns.bcls}}">{{vp.ns.status}}</span></div>
            <div class="panel-bd" style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-weight: 600; font-size: 14px">{{vp.ns.service}}</span>
              <span>{{vp.ns.when}}</span>
              <span class="muted" style="font-size: 12px">{{vp.ns.basis}}</span>
              <button class="btn btn-secondary btn-sm" style="align-self: flex-start; margin-top: 6px" onClick="{{vp.book}}">Book this service</button>
            </div>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Declined work</h2><span class="muted" style="font-size: 12px">Recommend follow-up</span></div>
            <sc-for list="{{vp.declined}}" as="d" hint-placeholder-count="2">
              <div class="li" style="flex-direction: column; align-items: stretch; gap: 6px">
                <span style="display: flex; gap: 8px; align-items: flex-start"><span style="flex: 1; font-weight: 500">{{d.desc}}</span><span style="font-variant-numeric: tabular-nums">{{d.amount}}</span></span>
                <span class="muted" style="font-size: 12px">{{d.sub}}</span>
                <span style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap"><span class="badge {{d.bcls}}">{{d.status}}</span><span class="sp"></span><sc-if value="{{d.canAct}}" hint-placeholder-val="{{ true }}"><button class="btn btn-xs btn-ghost" onClick="{{d.dismiss}}">Dismiss</button><button class="btn btn-xs btn-secondary" onClick="{{d.follow}}">Send follow-up</button><button class="btn btn-xs btn-primary" onClick="{{d.book}}">Book</button></sc-if></span>
              </div>
            </sc-for>
            <sc-if value="{{vp.noDeclined}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>Nothing declined on this vehicle.</span></div></sc-if>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Mileage history</h2></div>
            <div class="panel-bd">
              <div class="mchart" role="img" aria-label="{{vp.mAria}}"><sc-for list="{{vp.mbars}}" as="b" hint-placeholder-count="5"><div class="mbar-col bar-col" data-tip="{{b.tip}}"><div class="mbar {{b.cls}}" style="height: {{b.h}}%"></div></div></sc-for></div>
              <div class="mlabels" aria-hidden="true"><sc-for list="{{vp.mbars}}" as="b" hint-placeholder-count="5"><span>{{b.label}}</span></sc-for></div>
            </div>
            <div class="dt dt-sm" role="table" aria-label="Odometer readings" style="max-height: 220px">
              <div class="dt-row dt-head" role="row" style="grid-template-columns: 110px 100px 90px minmax(0, 1fr)"><div class="dt-c" role="columnheader">Date</div><div class="dt-c ta-r" role="columnheader">Odometer</div><div class="dt-c ta-r" role="columnheader">Change</div><div class="dt-c" role="columnheader">Source</div></div>
              <div class="dt-body"><sc-for list="{{vp.mrows}}" as="m" hint-placeholder-count="5"><div class="dt-row" role="row" style="grid-template-columns: 110px 100px 90px minmax(0, 1fr)"><div class="dt-c muted" role="cell">{{m.date}}</div><div class="dt-c ta-r" role="cell">{{m.mi}}</div><div class="dt-c ta-r muted" role="cell">{{m.delta}}</div><div class="dt-c mono" role="cell">{{m.src}}</div></div></sc-for></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Specs</h2></div>
            <div class="panel-bd"><dl class="kv"><sc-for list="{{vp.specs}}" as="sp" hint-placeholder-count="8"><dt>{{sp.k}}</dt><dd>{{sp.v}}</dd></sc-for></dl></div>
          </section>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{view.missing}}" hint-placeholder-val="{{ false }}">
      <section class="panel"><div class="empty"><span class="empty-title">Record not found</span><span>It may belong to another workspace. Data is isolated per tenant.</span><button class="btn btn-secondary btn-sm" onClick="{{go.dashboard}}" style="margin-top: 6px">Back to dashboard</button></div></section>
    </sc-if>

    <!-- ============ APPOINTMENTS ============ -->
    <sc-if value="{{view.appointments}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="2"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd">
        <div><h1 class="h1">Appointments</h1><div class="muted" style="font-size: 12px">{{cal.summary}}</div></div>
        <span class="sp"></span>
        <button class="btn btn-primary" onClick="{{cal.newAppt}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New appointment</button>
      </div>
      <section class="panel">
        <div class="panel-hd" style="gap: 10px">
          <div class="seg" role="group" aria-label="Calendar view"><button class="{{cal.dayOn}}" onClick="{{cal.toDay}}">Day</button><button class="{{cal.weekOn}}" onClick="{{cal.toWeek}}">Week</button></div>
          <button class="btn btn-secondary btn-sm" onClick="{{cal.today}}">Today</button>
          <button class="btn btn-ghost btn-icon btn-sm" onClick="{{cal.prev}}" aria-label="Previous"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="btn btn-ghost btn-icon btn-sm" onClick="{{cal.next}}" aria-label="Next"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
          <h2 class="h2" style="font-size: 16px">{{cal.title}}</h2>
          <span class="sp"></span>
          <div class="legend" aria-label="Legend"><span><i style="background: #EEF2FF; border-color: #B7C5F5"></i>Confirmed</span><span><i style="background: #FFFBEB; border-color: #E9C46A; border-style: dashed"></i>Tentative</span><span><i style="background: #ECFDF3; border-color: #A6E3BD"></i>Arrived / done</span><span><i style="background: #FEF3F2; border-color: #FECDCA"></i>No-show</span></div>
        </div>
        <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px; display: grid; grid-template-columns: 64px repeat(4, minmax(0, 1fr)); gap: 12px"><div></div><div class="skel" style="height: 420px"></div><div class="skel" style="height: 420px"></div><div class="skel" style="height: 420px"></div><div class="skel" style="height: 420px"></div></div></sc-if>
        <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
          <!-- Day view -->
          <sc-if value="{{cal.isDay}}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{cal.closed}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span class="empty-title">{{cal.closedLabel}}</span><span>No bookings can be made. Try the next business day.</span><button class="btn btn-secondary btn-sm" onClick="{{cal.next}}" style="margin-top: 6px">Next day</button></div></sc-if>
            <sc-if value="{{cal.noBays}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-title">No technician bays set up</span><span>Add technicians in Settings › Users to start booking.</span></div></sc-if>
            <sc-if value="{{cal.open}}" hint-placeholder-val="{{ true }}">
              <div class="cal-wrap {{cal.dragCls}}">
                <div class="cal-grid" style="grid-template-columns: {{cal.gtc}}">
                  <div class="cal-corner"></div>
                  <sc-for list="{{cal.bays}}" as="bay" hint-placeholder-count="4"><div class="cal-hcell"><span class="av {{bay.av}}">{{bay.ini}}</span><span style="min-width: 0"><span style="display: block">{{bay.name}} · {{bay.tech}}</span><span class="muted" style="font-weight: 400">{{bay.load}}</span></span></div></sc-for>
                  <div class="cal-gutter" aria-hidden="true"><sc-for list="{{cal.hours}}" as="h" hint-placeholder-count="11"><div class="cal-hour">{{h.label}}</div></sc-for></div>
                  <sc-for list="{{cal.bays}}" as="bay" hint-placeholder-count="4">
                    <div class="cal-col">
                      <sc-for list="{{bay.slots}}" as="sl" hint-placeholder-count="22"><button class="slot {{sl.cls}}" aria-label="{{sl.aria}}" onClick="{{sl.book}}" onDragEnter="{{sl.enter}}" onDragOver="{{sl.over}}" onDrop="{{sl.drop}}"></button></sc-for>
                      <sc-for list="{{bay.appts}}" as="ap" hint-placeholder-count="2">
                        <button class="appt {{ap.cls}}" draggable="{{ap.draggable}}" style="top: {{ap.top}}px; height: {{ap.h}}px" aria-label="{{ap.aria}}" onClick="{{ap.open}}" onDragStart="{{ap.dragStart}}" onDragEnd="{{ap.dragEnd}}">
                          <span class="appt-t">{{ap.time}} · {{ap.cust}}</span>
                          <sc-if value="{{ap.tall}}" hint-placeholder-val="{{ true }}"><span>{{ap.veh}}</span><span style="opacity: .85">{{ap.reason}}</span></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{cal.showNow}}" hint-placeholder-val="{{ false }}"><div class="now-line" style="top: {{cal.nowTop}}px"></div></sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </sc-if>
          <!-- Week view -->
          <sc-if value="{{cal.isWeek}}" hint-placeholder-val="{{ false }}">
            <div class="cal-wrap {{cal.dragCls}}">
              <div class="cal-grid" style="grid-template-columns: 180px repeat(6, minmax(140px, 1fr)); min-width: 1020px">
                <div class="cal-corner"></div>
                <sc-for list="{{cal.dayHd}}" as="d" hint-placeholder-count="6"><button class="cal-hcell {{d.cls}}" onClick="{{d.open}}" aria-label="{{d.aria}}"><span>{{d.label}}</span><span class="muted" style="font-weight: 400">{{d.sub}}</span></button></sc-for>
                <sc-for list="{{cal.rows}}" as="row" hint-placeholder-count="4">
                  <div class="bay-hd"><span class="av {{row.av}}">{{row.ini}}</span><span><span style="display: block">{{row.name}}</span><span class="muted" style="font-weight: 400">{{row.tech}}</span></span></div>
                  <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="6">
                    <div class="wk-cell {{cell.cls}}" onDragEnter="{{cell.enter}}" onDragOver="{{cell.over}}" onDrop="{{cell.drop}}">
                      <sc-if value="{{cell.closed}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 12px">{{cell.closedLabel}}</span></sc-if>
                      <sc-for list="{{cell.chips}}" as="ap" hint-placeholder-count="1"><button class="chip-appt {{ap.cls}}" draggable="{{ap.draggable}}" aria-label="{{ap.aria}}" onClick="{{ap.open}}" onDragStart="{{ap.dragStart}}" onDragEnd="{{ap.dragEnd}}"><span class="appt-t">{{ap.timeShort}} · {{ap.cust}}</span><span class="ellip">{{ap.reason}}</span></button></sc-for>
                      <sc-if value="{{cell.canBook}}" hint-placeholder-val="{{ true }}"><button class="wk-add" onClick="{{cell.add}}" aria-label="{{cell.addAria}}">+ Book</button></sc-if>
                    </div>
                  </sc-for>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </sc-if>
        <div class="hint" style="padding: 10px 16px; border-top: 1px solid #E4E7EC">Drag an appointment to another time or bay to reschedule; the customer is notified automatically. Click an empty slot to book. Arrived and completed visits are locked.</div>
      </section>
    </sc-if>

    <!-- ============ COMMUNICATIONS ============ -->
    <sc-if value="{{view.comms}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="2"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd"><div><h1 class="h1">Communications</h1><div class="muted" style="font-size: 12px">SMS, email and WhatsApp in one log, plus automated service reminders</div></div></div>
      <div class="stat-row"><sc-for list="{{cm.stats}}" as="k" hint-placeholder-count="4"><div class="stat"><span class="kpi-label">{{k.label}}</span><span class="stat-v">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for></div>
      <div class="tabs" role="tablist" aria-label="Communications sections"><sc-for list="{{cm.tabs}}" as="tb" hint-placeholder-count="2"><button class="tab {{tb.cls}}" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}">{{tb.label}}</button></sc-for></div>

      <sc-if value="{{cm.isInbox}}" hint-placeholder-val="{{ true }}">
        <div class="comms">
          <section class="panel">
            <div class="panel-hd" style="gap: 8px">
              <div class="searchbox" style="width: 240px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Search messages" placeholder="Search customer, text, RO…" value="{{cm.q}}" onChange="{{cm.onQ}}"></div>
              <sc-for list="{{cm.filters}}" as="fl" hint-placeholder-count="6"><button class="chip {{fl.cls}}" aria-pressed="{{fl.on}}" onClick="{{fl.pick}}">{{fl.label}}</button></sc-for>
            </div>
            <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 12px"><sc-for list="{{skel8}}" as="s" hint-placeholder-count="8"><div class="skel" style="height: 18px"></div></sc-for></div></sc-if>
            <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
              <div class="msg-list" role="list">
                <sc-for list="{{cm.rows}}" as="mr" hint-placeholder-count="10">
                  <button class="msg-row {{mr.cls}}" role="listitem" onClick="{{mr.pick}}">
                    <span class="muted" style="font-size: 12px">{{mr.when}}</span>
                    <span style="display: flex; align-items: center; gap: 6px; min-width: 0"><sc-if value="{{mr.needs}}" hint-placeholder-val="{{ false }}"><span class="unread-dot" title="Needs reply"></span></sc-if><span class="ellip" style="font-weight: 600">{{mr.cust}}</span></span>
                    <span class="ch"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{mr.chIcon}}"/></svg>{{mr.ch}}</span>
                    <span style="display: flex; align-items: center; gap: 6px; min-width: 0"><svg class="ic ic-sm" viewBox="0 0 24 24" role="img" aria-label="{{mr.dirLabel}}" style="color: #5B6474"><path d="{{mr.dirIcon}}"/></svg><sc-if value="{{mr.auto}}" hint-placeholder-val="{{ false }}"><span class="tag tag-gray">Auto</span></sc-if><span class="ellip"><strong style="font-weight: 500">{{mr.kind}}</strong><span class="muted"> · {{mr.body}}</span></span></span>
                    <span><span class="badge {{mr.bcls}}">{{mr.status}}</span></span>
                  </button>
                </sc-for>
              </div>
              <sc-if value="{{cm.noRows}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-title">No messages match</span><span>Clear the search or pick another filter.</span></div></sc-if>
            </sc-if>
          </section>

          <sc-if value="{{hasThread}}" hint-placeholder-val="{{ true }}">
            <section class="panel" style="position: sticky; top: 16px">
              <div class="panel-hd"><div style="min-width: 0"><div class="h2">{{th.name}}</div><div class="muted ellip" style="font-size: 12px">{{th.sub}}</div></div><span class="sp"></span><button class="btn btn-ghost btn-sm" onClick="{{th.openProfile}}">View profile</button></div>
              <div class="thread" aria-live="polite">
                <sc-for list="{{th.msgs}}" as="mg" hint-placeholder-count="4">
                  <div class="bub {{mg.cls}}"><span class="bub-head">{{mg.head}}</span><span style="white-space: pre-line">{{mg.body}}</span><span class="bub-meta"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="{{mg.chIcon}}"/></svg>{{mg.meta}}<span class="badge {{mg.bcls}}" style="height: 18px; font-size: 11px">{{mg.status}}</span><sc-if value="{{mg.hasRef}}" hint-placeholder-val="{{ false }}"><button class="lnk mono" style="font-size: 11px" onClick="{{mg.openRef}}">{{mg.ref}}</button></sc-if></span></div>
                </sc-for>
              </div>
              <div class="composer">
                <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
                  <label class="label" for="cm-ch">Send via</label>
                  <select id="cm-ch" class="select" style="width: 130px; height: 28px" value="{{th.ch}}" onChange="{{th.setCh}}"><option value="SMS">SMS</option><option value="Email">Email</option><option value="WhatsApp">WhatsApp</option></select>
                  <span class="sp"></span>
                  <sc-for list="{{th.templates}}" as="tp" hint-placeholder-count="3"><button class="chip" onClick="{{tp.pick}}">{{tp.label}}</button></sc-for>
                </div>
                <textarea class="input textarea" aria-label="Reply" placeholder="Write a reply…" value="{{th.text}}" onChange="{{th.setText}}"></textarea>
                <div style="display: flex; align-items: center; gap: 8px"><span class="{{th.hintCls}}">{{th.hint}}</span><span class="sp"></span><span class="tipwrap" data-tip="{{th.sendTip}}"><button class="btn btn-primary btn-sm" disabled="{{th.sendDisabled}}" onClick="{{th.send}}">Send {{th.chLabel}}</button></span></div>
              </div>
            </section>
          </sc-if>
          <sc-if value="{{noThread}}" hint-placeholder-val="{{ false }}"><section class="panel"><div class="empty"><span class="empty-title">No conversation selected</span><span>Pick a message to open the thread.</span></div></section></sc-if>
        </div>
      </sc-if>

      <sc-if value="{{cm.isAuto}}" hint-placeholder-val="{{ false }}">
        <div class="split">
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Scheduled reminders</h2><span class="muted" style="font-size: 12px">Queued by the rules on the right. Send early or skip.</span></div>
            <sc-for list="{{cm.upcoming}}" as="u" hint-placeholder-count="5">
              <div class="li" style="align-items: flex-start">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #5B6474; margin-top: 2px"><path d="{{u.chIcon}}"/></svg>
                <div style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 3px">
                  <span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span class="tag tag-gray">{{u.rule}}</span><button class="lnk" onClick="{{u.openCust}}">{{u.cust}}</button><span class="muted" style="font-size: 12px">by {{u.ch}}</span></span>
                  <span style="color: #475467">{{u.body}}</span>
                </div>
                <span class="kpi-sub {{u.whenCls}}" style="min-width: 96px; text-align: right; font-weight: 500">{{u.when}}</span>
                <button class="btn btn-xs btn-ghost" onClick="{{u.skip}}">Skip</button>
                <button class="btn btn-xs btn-secondary" onClick="{{u.send}}">Send now</button>
              </div>
            </sc-for>
            <sc-if value="{{cm.noUp}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="empty-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span><span class="empty-title">Nothing queued</span><span>Reminders appear here as appointments, due services and declined work come up.</span></div></sc-if>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Automation rules</h2></div>
            <sc-for list="{{cm.rules}}" as="ru" hint-placeholder-count="6">
              <div class="rule">
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{ru.name}}</span><span class="muted" style="font-size: 12px">{{ru.trigger}} · {{ru.ch}}</span><span class="muted" style="font-size: 12px">{{ru.sent}}</span></div>
                <span class="muted" style="font-size: 12px; width: 24px">{{ru.state}}</span>
                <button class="switch {{ru.cls}}" role="switch" aria-checked="{{ru.on}}" aria-label="{{ru.aria}}" onClick="{{ru.toggle}}"></button>
              </div>
            </sc-for>
          </section>
        </div>
      </sc-if>
    </sc-if>

    <!-- ============ SETTINGS ============ -->
    <sc-if value="{{view.settings}}" hint-placeholder-val="{{ false }}">

  <span class="big">Balance due</span><span class="big">{{inv.doc.bal}}</span>
</div>
<sc-if value="{{inv.doc.hasDec}}" hint-placeholder-val="{{ false }}"><div style="border: 1px solid #F5D58A; background: #FFFBEB; border-radius: 6px; padding: 8px 10px"><div class="doc-k" style="color: #92400E">Recommended, not yet done</div><sc-for list="{{inv.doc.dec}}" as="dd" hint-placeholder-count="1"><div>{{dd.text}}</div></sc-for></div></sc-if>
<div class="doc-foot"><span>{{inv.doc.terms}}</span><span>{{inv.doc.warranty}}</span><span>Thank you for choosing {{inv.doc.shop}}.</span></div>
        </div></div>
        <div class="stack">
          <section class="panel"><div class="panel-hd"><h2 class="h2">Balance</h2></div><div class="panel-bd" style="display: flex; flex-direction: column; gap: 10px">
            <div class="tot"><sc-for list="{{inv.summary}}" as="sm2" hint-placeholder-count="5"><span class="muted">{{sm2.k}}</span><span>{{sm2.v}}</span></sc-for><span class="grand">Balance due</span><span class="grand kpi-sub {{inv.balCls}}" style="font-size: 16px">{{inv.bal}}</span></div>
            <span class="hint">{{inv.dueText}}</span>
            <sc-if value="{{inv.canPay}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{inv.pay}}">Record payment</button></sc-if>
          </div></section>
          <section class="panel"><div class="panel-hd"><h2 class="h2">Payments and receipts</h2></div>
            <sc-for list="{{inv.pays}}" as="py" hint-placeholder-count="1"><div class="li"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">{{py.amt}} · {{py.method}}</span><span class="hint">{{py.when}}</span></span><button class="btn btn-ghost btn-xs" onClick="{{py.open}}">Receipt {{py.rcpt}}</button></div></sc-for>
            <sc-if value="{{inv.noPays}}" hint-placeholder-val="{{ true }}"><div class="empty empty-sm"><span>No payments yet.</span></div></sc-if>
          </section>
          <section class="panel"><div class="panel-hd"><h2 class="h2">History</h2></div><div class="panel-bd" style="padding-top: 6px"><div class="tl"><sc-for list="{{inv.log}}" as="lg" hint-placeholder-count="2"><div class="tl-item"><span class="tl-dot k-pay"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg></span><div class="tl-body"><span><strong style="font-weight: 600">{{lg.who}}</strong> · {{lg.text}}</span><span class="tl-meta">{{lg.when}}</span></div></div></sc-for></div></div></section>
        </div>
      </div>
    </sc-if>

    <!-- ============ REPORTS ============ -->
    <sc-if value="{{view.reports}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="2"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd" style="align-items: center"><div><h1 class="h1">Reports</h1><div class="muted" style="font-size: 12px">{{rpt.range}}</div></div><span class="sp"></span><div class="seg" role="group" aria-label="Period"><sc-for list="{{rpt.pers}}" as="pp" hint-placeholder-count="4"><button class="{{pp.cls}}" onClick="{{pp.pick}}">{{pp.label}}</button></sc-for></div></div>
      <div class="stat-row"><sc-for list="{{rpt.kpis}}" as="k" hint-placeholder-count="4"><div class="stat"><span class="kpi-label">{{k.label}}</span><span class="stat-v">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for></div>
      <div class="grid-2">
        <section class="panel"><div class="panel-hd"><h2 class="h2">Revenue · {{rpt.chartTitle}}</h2></div>
          <div class="chart" role="img" aria-label="Collected revenue over the selected period"><div class="chart-y" aria-hidden="true"><span>{{rpt.t2}}</span><span>{{rpt.t1}}</span><span>$0</span></div><div class="chart-plot" aria-hidden="true"><div class="grid-lines"><span></span><span></span><span></span></div><div class="bars" style="grid-template-columns: {{rpt.gtc}}"><sc-for list="{{rpt.bars}}" as="b" hint-placeholder-count="24"><div class="bar-col" data-tip="{{b.tip}}"><div class="bar {{b.cls}}" style="height: {{b.h}}%"></div></div></sc-for></div><div class="bar-labels" style="grid-template-columns: {{rpt.gtc}}"><sc-for list="{{rpt.bars}}" as="b" hint-placeholder-count="24"><span>{{b.label}}</span></sc-for></div></div></div>
        </section>
        <section class="panel"><div class="panel-hd"><h2 class="h2">Payment methods</h2></div><div class="panel-bd"><div class="bars-h"><sc-for list="{{rpt.mix}}" as="m" hint-placeholder-count="4"><div class="bar-h"><span>{{m.label}}</span><span class="track"><span class="fill {{m.cls}}" style="display: block; width: {{m.pct}}%"></span></span><span class="ta-r">{{m.val}}</span></div></sc-for></div><sc-if value="{{rpt.noMix}}" hint-placeholder-val="{{ false }}"><span class="hint">No payments in this period.</span></sc-if></div></section>
      </div>
      <div class="rpt-grid">
        <section class="panel"><div class="panel-hd"><h2 class="h2">Technician productivity</h2><span class="sp"></span><span class="muted" style="font-size: 12px">Team efficiency <strong style="color: #101828">{{rpt.teamEff}}</strong> · {{rpt.teamSub}}</span></div>
          <div class="dt dt-sm" role="table" aria-label="Technician productivity" style="border-top: 0"><div class="dt-row dt-head" role="row" style="grid-template-columns: minmax(0, 1.2fr) 90px 90px minmax(0, 1fr) 70px"><div class="dt-c" role="columnheader">Technician</div><div class="dt-c ta-r" role="columnheader">Billed</div><div class="dt-c ta-r" role="columnheader">Clocked</div><div class="dt-c" role="columnheader">Efficiency</div><div class="dt-c ta-r" role="columnheader"></div></div><div class="dt-body"><sc-for list="{{rpt.techs}}" as="tc" hint-placeholder-count="4"><div class="dt-row" role="row" style="grid-template-columns: minmax(0, 1.2fr) 90px 90px minmax(0, 1fr) 70px"><div class="dt-c" role="cell" style="display: flex; gap: 8px; align-items: center"><span class="av {{tc.av}}">{{tc.ini}}</span>{{tc.name}}</div><div class="dt-c ta-r" role="cell">{{tc.billed}}</div><div class="dt-c ta-r" role="cell">{{tc.clocked}}</div><div class="dt-c" role="cell"><span class="meter"><span class="meter-fill {{tc.cls}}" style="width: {{tc.pct}}%"></span></span></div><div class="dt-c ta-r" role="cell"><span class="kpi-sub {{tc.effCls}}" style="font-weight: 600">{{tc.eff}}</span></div></div></sc-for></div></div>
          <div class="hint" style="padding: 8px 16px 12px">Billed = approved labor hours on ROs completed in the period. Clocked = time-clock hours on those same ROs. Above 100% means the work beat the book time.</div>
        </section>
        <section class="panel"><div class="panel-hd"><h2 class="h2">Parts margin</h2><span class="sp"></span><span class="muted" style="font-size: 12px">{{rpt.partsRev}} sold · {{rpt.partsGp}} gross profit · <strong style="color: #101828">{{rpt.partsM}}</strong></span></div>
          <div class="dt dt-sm" role="table" aria-label="Parts margin by category" style="border-top: 0"><div class="dt-row dt-head" role="row" style="grid-template-columns: minmax(0, 1fr) 90px 90px minmax(0, 1fr) 54px"><div class="dt-c" role="columnheader">Category</div><div class="dt-c ta-r" role="columnheader">Sales</div><div class="dt-c ta-r" role="columnheader">Cost</div><div class="dt-c" role="columnheader">Margin</div><div class="dt-c" role="columnheader"></div></div><div class="dt-body"><sc-for list="{{rpt.margins}}" as="mg" hint-placeholder-count="5"><div class="dt-row" role="row" style="grid-template-columns: minmax(0, 1fr) 90px 90px minmax(0, 1fr) 54px"><div class="dt-c" role="cell">{{mg.label}}</div><div class="dt-c ta-r" role="cell">{{mg.rev}}</div><div class="dt-c ta-r muted" role="cell">{{mg.cost}}</div><div class="dt-c" role="cell"><span class="meter"><span class="meter-fill {{mg.cls}}" style="width: {{mg.pct}}%"></span></span></div><div class="dt-c ta-r" role="cell" style="font-weight: 600">{{mg.m}}</div></div></sc-for></div></div>
          <sc-if value="{{rpt.noMargins}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No parts invoiced in this period.</span></div></sc-if>
        </section>
        <section class="panel"><div class="panel-hd"><h2 class="h2">Estimate approval rate</h2></div><div class="panel-bd" style="display: flex; flex-direction: column; gap: 14px">
          <div class="form-2"><div class="stat" style="border: 0; padding: 0"><span class="kpi-label">By jobs</span><span class="stat-v">{{rpt.apprRate}}</span><span class="kpi-sub">{{rpt.apprSub}}</span></div><div class="stat" style="border: 0; padding: 0"><span class="kpi-label">By value</span><span class="stat-v">{{rpt.apprVal}}</span><span class="kpi-sub">{{rpt.apprValSub}}</span></div></div>
          <div class="bars-h"><sc-for list="{{rpt.apprBars}}" as="ab" hint-placeholder-count="2"><div class="bar-h"><span>{{ab.label}}</span><span class="track"><span class="fill {{ab.cls}}" style="display: block; width: {{ab.pct}}%"></span></span><span class="ta-r">{{ab.val}}</span></div></sc-for></div>
          <span class="hint">Pending: {{rpt.pend}}</span>
        </div></section>
        <section class="panel"><div class="panel-hd"><h2 class="h2">Declined-work recovery</h2></div><div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><div><div class="kpi-label">Declined</div><div class="stat-v">{{rpt.decTotal}}</div><div class="kpi-sub">{{rpt.decCount}}</div></div><div><div class="kpi-label">Followed up</div><div class="stat-v">{{rpt.folRate}}</div><div class="kpi-sub">Reminder sent or booked</div></div><div><div class="kpi-label">Recovered</div><div class="stat-v">{{rpt.recRate}}</div><div class="kpi-sub">{{rpt.recVal}}</div></div></div>
          <div><sc-for list="{{rpt.decRows}}" as="dr" hint-placeholder-count="4"><button class="li-btn" style="padding: 8px 0" onClick="{{dr.open}}"><span style="flex: 1; min-width: 0"><span class="ellip" style="display: block; font-weight: 500">{{dr.desc}}</span><span class="hint">{{dr.sub}}</span></span><span style="font-variant-numeric: tabular-nums">{{dr.amt}}</span><span class="badge {{dr.bcls}}">{{dr.status}}</span></button></sc-for></div>
          <sc-if value="{{rpt.noDec}}" hint-placeholder-val="{{ false }}"><span class="hint">No declined work in this period.</span></sc-if>
        </div></section>
      </div>
      <section class="panel"><div class="panel-hd"><h2 class="h2">Aging receivables</h2><span class="sp"></span><span class="muted" style="font-size: 12px">Outstanding <strong style="color: #101828">{{rpt.arTotal}}</strong> · overdue {{rpt.arOver}} · as of today</span></div>
        <div class="panel-bd"><div class="bars-h"><sc-for list="{{rpt.buckets}}" as="bk" hint-placeholder-count="5"><div class="bar-h"><span>{{bk.label}}</span><span class="track"><span class="fill {{bk.cls}}" style="display: block; width: {{bk.pct}}%"></span></span><span class="ta-r">{{bk.val}}</span></div></sc-for></div></div>
        <div class="dt dt-sm" role="table" aria-label="Open invoices by age"><div class="dt-row dt-head" role="row" style="grid-template-columns: 100px minmax(0, 1fr) 90px 100px 110px 130px"><div class="dt-c" role="columnheader">Invoice</div><div class="dt-c" role="columnheader">Customer</div><div class="dt-c" role="columnheader">Due</div><div class="dt-c" role="columnheader">Past due</div><div class="dt-c ta-r" role="columnheader">Balance</div><div class="dt-c" role="columnheader">Status</div></div><div class="dt-body"><sc-for list="{{rpt.agingRows}}" as="ag" hint-placeholder-count="4"><div class="dt-row" role="row" style="grid-template-columns: 100px minmax(0, 1fr) 90px 100px 110px 130px"><div class="dt-c" role="cell"><button class="lnk mono" onClick="{{ag.open}}">{{ag.id}}</button></div><div class="dt-c" role="cell">{{ag.cust}}</div><div class="dt-c muted" role="cell">{{ag.due}}</div><div class="dt-c" role="cell"><span class="kpi-sub {{ag.dCls}}" style="font-weight: 500">{{ag.days}}</span></div><div class="dt-c ta-r" role="cell">{{ag.bal}}</div><div class="dt-c" role="cell"><span class="badge {{ag.bcls}}">{{ag.status}}</span></div></div></sc-for></div></div>
        <sc-if value="{{rpt.noAging}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>Nothing outstanding.</span></div></sc-if>
      </section>
    </sc-if>

    <!-- ============ PART DETAIL ============ -->
    <sc-if value="{{view.part}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="3"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd" style="align-items: center">
        <div style="min-width: 0"><div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><h1 class="h1">{{prt.name}}</h1><span class="badge {{prt.bcls}}">{{prt.status}}</span></div><div class="muted" style="font-size: 12px"><span class="mono">{{prt.id}}</span> · {{prt.cat}} · Bin {{prt.bin}}</div></div>
        <span class="sp"></span>
        <button class="btn btn-primary" onClick="{{prt.reorder}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/></svg>{{prt.reorderLabel}}</button>
      </div>
      <sc-if value="{{prt.low}}" hint-placeholder-val="{{ false }}"><div class="banner banner-error" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span><strong>Low stock.</strong> {{prt.lowText}}</span></div></sc-if>
      <div class="stat-row"><sc-for list="{{prt.stats}}" as="k" hint-placeholder-count="4"><div class="stat"><span class="kpi-label">{{k.label}}</span><span class="stat-v">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for></div>
      <div class="split">
        <section class="panel">
          <div class="panel-hd"><h2 class="h2">Stock movements</h2><span class="muted" style="font-size: 12px">Every change, linked to the RO, PO or estimate that caused it</span></div>
          <div class="dt" role="table" aria-label="Stock movements" style="max-height: 520px">
            <div class="dt-row dt-head" role="row" style="grid-template-columns: 150px 160px 80px 90px 110px minmax(0, 1fr); min-width: 720px"><div class="dt-c" role="columnheader">When</div><div class="dt-c" role="columnheader">Type</div><div class="dt-c ta-r" role="columnheader">Qty</div><div class="dt-c ta-r" role="columnheader">On hand after</div><div class="dt-c" role="columnheader">Reference</div><div class="dt-c" role="columnheader">By</div></div>
            <div class="dt-body">
              <sc-for list="{{prt.moves}}" as="m" hint-placeholder-count="6">
                <div class="dt-row" role="row" style="grid-template-columns: 150px 160px 80px 90px 110px minmax(0, 1fr); min-width: 720px">
                  <div class="dt-c muted" role="cell">{{m.when}}</div>
                  <div class="dt-c" role="cell"><span class="badge {{m.bcls}}">{{m.type}}</span></div>
                  <div class="dt-c ta-r" role="cell" style="font-weight: 600">{{m.qty}}</div>
                  <div class="dt-c ta-r {{m.balCls}}" role="cell">{{m.bal}}</div>
                  <div class="dt-c" role="cell"><button class="lnk mono" onClick="{{m.open}}" title="{{m.refKind}}">{{m.ref}}</button></div>
                  <div class="dt-c muted" role="cell">{{m.by}}</div>
                </div>

            </div>

        <div class="stack">
          <section class="panel">

            <sc-for list="{{prt.pos}}" as="o" hint-placeholder-count="1"><button class="li-btn" onClick="{{o.open}}"><span class="mono" style="color: #1E40AF; min-width: 70px">{{o.ref}}</span><span style="flex: 1; min-width: 0"><span style="display: block">{{o.qty}} outstanding</span><span class="hint">{{o.sub}}</span></span><span class="badge {{o.bcls}}">Open</span></button></sc-for>
            <sc-if value="{{prt.noPos}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>Nothing on order.</span></div></sc-if>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Reserved for</h2></div>
            <sc-for list="{{prt.holds}}" as="h" hint-placeholder-count="1"><button class="li-btn" onClick="{{h.open}}"><span class="mono" style="color: #1E40AF; min-width: 70px">{{h.ref}}</span><span style="flex: 1; min-width: 0"><span style="display: block">{{h.qty}}</span><span class="hint">{{h.sub}}</span></span></button></sc-for>
            <sc-if value="{{prt.noHolds}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No reservations.</span></div></sc-if>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Details</h2><span class="sp"></span><sc-if value="{{prt.hasSup}}" hint-placeholder-val="{{ true }}"><button class="btn btn-ghost btn-sm" onClick="{{prt.openSup}}">Supplier</button></sc-if></div>

              </div>
              <button class="btn btn-secondary btn-sm" style="align-self: flex-end" disabled="{{prt.editDisabled}}" onClick="{{prt.saveEdit}}">Save settings</button>
            </div>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- ============ PURCHASE ORDER DETAIL ============ -->
    <sc-if value="{{view.po}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="3"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd" style="align-items: center">
        <div style="min-width: 0"><div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><h1 class="h1">{{pom.id}}</h1><span class="badge {{pom.bcls}}">{{pom.status}}</span></div><div class="muted" style="font-size: 12px"><sc-if value="{{pom.hasSup}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{pom.openSup}}">{{pom.supName}}</button> · </sc-if>{{pom.meta}}</div></div>
        <span class="sp"></span>
        <sc-if value="{{pom.draft}}" hint-placeholder-val="{{ true }}"><button class="btn btn-danger" onClick="{{pom.del}}">Delete draft</button><span class="tipwrap" data-tip="{{pom.sendTip}}"><button class="btn btn-primary" disabled="{{pom.sendDisabled}}" onClick="{{pom.send}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Send to supplier</button></span></sc-if>

        <sc-if value="{{pom.open}}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{pom.recvSel}}">Receive entered quantities</button><button class="btn btn-primary" onClick="{{pom.recvAll}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Receive all</button></sc-if>

      <sc-if value="{{pom.hasNote}}" hint-placeholder-val="{{ false }}"><div class="banner banner-info"><span>{{pom.note}}</span></div></sc-if>

      </sc-if>
      <div class="est-layout">
        <div class="stack">
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Lines</h2><span class="muted" style="font-size: 12px">{{pom.units}} · {{pom.total}}</span></div>
            <div class="ln-wrap">
              <div class="pl pl-head" style="grid-template-columns: minmax(180px, 1fr) 90px 80px 80px 90px 130px 150px 32px; min-width: 860px"><span>Part</span><span class="num">Ordered</span><span class="num">Received</span><span class="num">Remaining</span><span class="num">Unit cost</span><span>Receive now</span><span>Status</span><span></span></div>
              <sc-for list="{{pom.lines}}" as="l" hint-placeholder-count="2">
                <div class="pl" style="grid-template-columns: minmax(180px, 1fr) 90px 80px 80px 90px 130px 150px 32px; min-width: 860px">
                  <span style="min-width: 0; display: flex; flex-direction: column"><button class="lnk ellip" style="text-align: left" onClick="{{l.openPart}}">{{l.name}}</button><span class="hint"><span class="mono">{{l.id}}</span> · {{l.stockSub}}<sc-if value="{{l.low}}" hint-placeholder-val="{{ false }}"> · <strong style="color: #991B1B">low</strong></sc-if></span></span>
                  <span class="num"><sc-if value="{{l.draft}}" hint-placeholder-val="{{ true }}"><input class="input input-sm num" type="number" min="1" step="1" aria-label="{{l.qAria}}" value="{{l.qty}}" onChange="{{l.onQty}}"></sc-if><sc-if value="{{l.notDraft}}" hint-placeholder-val="{{ false }}">{{l.qty}}</sc-if></span>
                  <span class="num">{{l.recv}}</span>
                  <span class="num">{{l.rem}}</span>
                  <span class="num muted">{{l.cost}}</span>
                  <span><sc-if value="{{l.canRecv}}" hint-placeholder-val="{{ false }}"><input class="input input-sm num" style="width: 80px" type="number" min="0" step="1" aria-label="{{l.rAria}}" value="{{l.recvVal}}" onChange="{{l.onRecv}}"></sc-if><sc-if value="{{l.doneRecv}}" hint-placeholder-val="{{ true }}"><span class="muted">—</span></sc-if></span>
                  <span><span class="badge {{l.bcls}}">{{l.status}}</span></span>
                  <span><sc-if value="{{l.draft}}" hint-placeholder-val="{{ true }}"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Remove line" onClick="{{l.remove}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-if></span>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{pom.noLines}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No lines yet.</span></div></sc-if>
            <sc-if value="{{pom.canAdd}}" hint-placeholder-val="{{ false }}">
              <div class="job-ft">
                <button class="btn btn-secondary btn-xs" onClick="{{pom.openPick}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add part</button>
                <sc-if value="{{pom.picking}}" hint-placeholder-val="{{ false }}">
                  <div class="part-pop" role="dialog" aria-label="Add part to PO">
                    <div style="display: flex; gap: 6px"><div class="searchbox" style="flex: 1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" type="search" aria-label="Search this supplier's parts" placeholder="Part # or name" value="{{pom.pickQ}}" onChange="{{pom.onPickQ}}"></div><button class="btn btn-ghost btn-sm" onClick="{{pom.closePick}}">Close</button></div>
                    <sc-for list="{{pom.pickResults}}" as="pr" hint-placeholder-count="4"><button class="li-btn" style="padding: 8px; border-radius: 6px; border-bottom: 0" onClick="{{pr.add}}"><span class="mono muted" style="min-width: 70px">{{pr.id}}</span><span style="flex: 1; min-width: 0"><span class="ellip" style="display: block">{{pr.name}}</span><span class="hint">{{pr.sub}}</span></span></button></sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-if>
            <div class="tot" style="padding: 12px 16px; border-top: 1px solid #E4E7EC"><span class="grand">Total</span><span class="grand">{{pom.total}}</span></div>
          </section>
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">History</h2></div>
            <div class="panel-bd" style="padding-top: 6px"><div class="tl"><sc-for list="{{pom.log}}" as="lg" hint-placeholder-count="3"><div class="tl-item"><span class="tl-dot k-po"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg></span><div class="tl-body"><span><strong style="font-weight: 600">{{lg.who}}</strong> · {{lg.text}}</span><span class="tl-meta">{{lg.when}}</span></div></div></sc-for></div></div>
          </section>
        </div>
        <div class="stack">
          <sc-if value="{{pom.hasSup}}" hint-placeholder-val="{{ true }}"><section class="panel"><div class="panel-hd"><h2 class="h2">Supplier</h2><span class="sp"></span><button class="btn btn-ghost btn-sm" onClick="{{pom.openSup}}">Open</button></div><div class="panel-bd"><div style="font-weight: 600; margin-bottom: 8px">{{pom.supName}}</div><dl class="kv"><sc-for list="{{pom.supInfo}}" as="d" hint-placeholder-count="6"><dt>{{d.k}}</dt><dd>{{d.v}}</dd></sc-for></dl></div></section></sc-if>
          <sc-if value="{{pom.hasLinked}}" hint-placeholder-val="{{ false }}"><section class="panel"><div class="panel-hd"><h2 class="h2">Repair orders waiting</h2></div><sc-for list="{{pom.linked}}" as="lk" hint-placeholder-count="1"><button class="li-btn" onClick="{{lk.open}}"><span class="mono" style="color: #1E40AF; min-width: 70px">{{lk.id}}</span><span class="ellip" style="flex: 1">{{lk.sub}}</span><span class="badge {{lk.bcls}}">RO</span></button></sc-for><div class="hint" style="padding: 8px 16px 12px">Receiving this PO in full reserves the parts and moves these ROs out of Waiting Parts.</div></section></sc-if>
        </div>
      </div>
    </sc-if>

    <!-- ============ SUPPLIER DETAIL ============ -->
    <sc-if value="{{view.supplier}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="3"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd" style="align-items: center"><div><h1 class="h1">{{spm.name}}</h1><div class="muted" style="font-size: 12px"><span class="mono">{{spm.id}}</span> · {{spm.cats}}</div></div><span class="sp"></span><button class="btn btn-primary" onClick="{{spm.newPo}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New purchase order</button></div>
      <div class="stat-row"><sc-for list="{{spm.stats}}" as="k" hint-placeholder-count="4"><div class="stat"><span class="kpi-label">{{k.label}}</span><span class="stat-v">{{k.value}}</span><span class="kpi-sub {{k.subCls}}">{{k.sub}}</span></div></sc-for></div>
      <div class="split">
        <div class="stack">
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Parts from this supplier</h2></div>
            <sc-for list="{{spm.parts}}" as="sp" hint-placeholder-count="5"><button class="li-btn" onClick="{{sp.open}}"><span class="mono muted" style="min-width: 70px">{{sp.id}}</span><span class="ellip" style="flex: 1">{{sp.name}}</span><span class="muted" style="font-size: 12px; min-width: 110px; text-align: right">{{sp.avail}} avail · reorder {{sp.reorder}}</span><span class="badge {{sp.bcls}}">{{sp.status}}</span></button></sc-for>
          </section>
        </div>
        <div class="stack">
          <section class="panel"><div class="panel-hd"><h2 class="h2">Contact</h2></div><div class="panel-bd"><dl class="kv"><sc-for list="{{spm.info}}" as="d" hint-placeholder-count="6"><dt>{{d.k}}</dt><dd>{{d.v}}</dd></sc-for></dl></div></section>
          <section class="panel"><div class="panel-hd"><h2 class="h2">Purchase orders</h2></div><sc-for list="{{spm.pos}}" as="o" hint-placeholder-count="3"><button class="li-btn" onClick="{{o.open}}"><span class="mono" style="color: #1E40AF; min-width: 70px">{{o.id}}</span><span class="ellip" style="flex: 1">{{o.sub}}</span><span class="badge {{o.bcls}}">{{o.status}}</span></button></sc-for><sc-if value="{{spm.noPos}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No purchase orders yet.</span></div></sc-if></section>
        </div>
      </div>
    </sc-if>

    <!-- ============ REPAIR ORDER DETAIL ============ -->
    <sc-if value="{{view.ro}}" hint-placeholder-val="{{ false }}">
      <div class="crumbs"><sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="3"><sc-if value="{{cr.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">/</span></sc-if><sc-if value="{{cr.link}}" hint-placeholder-val="{{ true }}"><button class="lnk" onClick="{{cr.go}}">{{cr.label}}</button></sc-if><sc-if value="{{cr.last}}" hint-placeholder-val="{{ false }}"><span style="color: #101828; font-weight: 500">{{cr.label}}</span></sc-if></sc-for></div>
      <div class="page-hd" style="align-items: center">
        <div style="min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h1 class="h1">{{rod.id}}</h1><span class="badge {{rod.bcls}}">{{rod.status}}</span><span class="tag {{rod.priCls}}">{{rod.priority}}</span><sc-if value="{{rod.comeback}}" hint-placeholder-val="{{ false }}"><span class="tag tag-red">Comeback of {{rod.comebackOf}}</span></sc-if></div>
          <div class="muted" style="font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px"><button class="lnk" onClick="{{rod.openVeh}}">{{rod.vehName}}</button><span class="plate">{{rod.plate}}</span><span>{{rod.miles}}</span><span>·</span><button class="lnk" onClick="{{rod.openCust}}">{{rod.custName}}</button><span>{{rod.custPhone}}</span></div>
        </div>
        <span class="sp"></span>
        <sc-if value="{{rod.showAddl}}" hint-placeholder-val="{{ false }}"><span class="tipwrap" data-tip="{{rod.addlTip}}"><button class="btn btn-secondary" disabled="{{rod.addlDisabled}}" onClick="{{rod.requestAddl}}">Request additional approval</button></span></sc-if>
        <sc-if value="{{rod.canWait}}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{rod.wait}}">Waiting parts</button></sc-if>
        <sc-if value="{{rod.canResume}}" hint-placeholder-val="{{ false }}"><span class="tipwrap" data-tip="{{rod.resumeTip}}"><button class="btn btn-secondary" disabled="{{rod.resumeDisabled}}" onClick="{{rod.resume}}">Resume work</button></span></sc-if>
        <sc-if value="{{rod.canStart}}" hint-placeholder-val="{{ false }}"><span class="tipwrap" data-tip="{{rod.startTip}}"><button class="btn btn-secondary" disabled="{{rod.startDisabled}}" onClick="{{rod.start}}">Start work</button></span></sc-if>
        <sc-if value="{{rod.showReady}}" hint-placeholder-val="{{ false }}"><span class="tipwrap" data-tip="{{rod.readyTip}}"><button class="btn btn-primary" disabled="{{rod.readyDisabled}}" onClick="{{rod.ready}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Mark Ready for QC</button></span></sc-if>
        <sc-if value="{{rod.canComplete}}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{rod.sendBack}}">Send back to technician</button><button class="btn btn-primary" onClick="{{rod.complete}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Pass QC and complete</button></sc-if>
        <sc-if value="{{rod.canInvoice}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{rod.invoice}}">Create invoice</button></sc-if>
        <sc-if value="{{rod.hasInv}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 12px">{{rod.invBal}}</span><button class="btn btn-primary" onClick="{{rod.openInv}}">Open {{rod.invId}}</button></sc-if>
      </div>

      <div class="stepper" aria-label="Repair order progress">
        <sc-for list="{{rod.steps}}" as="st" hint-placeholder-count="6"><span class="step {{st.cls}}"><span class="sn">{{st.n}}</span>{{st.label}}</span><sc-if value="{{st.bar}}" hint-placeholder-val="{{ true }}"><span class="step-bar {{st.barCls}}" aria-hidden="true"></span></sc-if></sc-for>
      </div>

      <div class="est-layout">
        <div class="stack">
          <!-- Jobs -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Jobs</h2><span class="muted" style="font-size: 12px">Concern, cause and correction for each job; checklist and parts</span></div>
            <sc-for list="{{rod.jobs}}" as="j" hint-placeholder-count="1">
              <div class="ro-job">
                <div class="job-hd"><span class="job-no">{{j.no}}</span><span style="font-weight: 600; font-size: 14px">{{j.name}}</span><span class="muted" style="font-size: 12px">{{j.hours}}</span><sc-if value="{{j.hasSrc}}" hint-placeholder-val="{{ false }}"><button class="lnk mono" style="font-size: 12px" onClick="{{j.openSrc}}">from {{j.src}}</button></sc-if><span class="sp"></span><span class="muted" style="font-size: 12px">Checklist {{j.checkText}}</span></div>
                <div class="ro-job-bd">
                  <div class="ccc-edit">
                    <div class="field"><span class="label">Concern</span><span>{{j.concern}}</span></div>
                    <sc-if value="{{j.editable}}" hint-placeholder-val="{{ true }}">
                      <div class="field"><label class="label">Cause<textarea class="input textarea" placeholder="What did you find?" value="{{j.cause}}" onChange="{{j.onCause}}" style="margin-top: 4px; font-weight: 400"></textarea></label></div>
                      <div class="field"><label class="label">Correction<textarea class="input textarea" placeholder="What did you do to fix it?" value="{{j.correction}}" onChange="{{j.onCorr}}" style="margin-top: 4px; font-weight: 400"></textarea></label></div>
                    </sc-if>
                    <sc-if value="{{j.readonly}}" hint-placeholder-val="{{ false }}">
                      <div class="field"><span class="label">Cause</span><span>{{j.causeRo}}</span></div>
                      <div class="field"><span class="label">Correction</span><span>{{j.corrRo}}</span></div>
                    </sc-if>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <div style="display: flex; align-items: center; gap: 8px"><span class="label">Checklist</span><span class="sp"></span><span class="hint">{{j.checkText}}</span></div>
                    <span class="meter"><span class="meter-fill {{j.checkCls}}" style="width: {{j.checkPct}}%"></span></span>
                    <div style="display: flex; flex-direction: column; gap: 1px">
                      <sc-for list="{{j.check}}" as="ck" hint-placeholder-count="4"><label class="chk {{ck.cls}}"><input type="checkbox" checked="{{ck.done}}" disabled="{{ck.disabled}}" onChange="{{ck.toggle}}"><span>{{ck.t}}</span></label></sc-for>
                    </div>
                  </div>
                </div>
                <div class="ln-wrap">
                  <div class="pl pl-head"><span>Part</span><span class="num">Planned</span><span class="num">Reserved</span><span>Actual used</span><span>Status</span></div>
                  <sc-for list="{{j.lines}}" as="l" hint-placeholder-count="2">
                    <div class="pl">
                      <span style="min-width: 0; display: flex; flex-direction: column"><span class="ellip" style="font-weight: 500">{{l.name}}</span><span class="hint mono" style="font-size: 11px">{{l.id}}</span></span>
                      <span class="num">{{l.plan}}</span>
                      <span class="num muted">{{l.res}}</span>
                      <span>
                        <sc-if value="{{l.notRecorded}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 6px; align-items: center"><input class="input input-sm num" style="width: 72px" type="number" min="0" step="0.1" aria-label="{{l.aria}}" value="{{l.draft}}" onChange="{{l.onDraft}}" disabled="{{l.recDisabled}}"><span class="muted" style="font-size: 12px">{{l.unit}}</span><span class="tipwrap" data-tip="{{l.recTip}}"><button class="btn btn-secondary btn-xs" disabled="{{l.recDisabled}}" onClick="{{l.record}}">Record</button></span></span></sc-if>
                        <sc-if value="{{l.recorded}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column"><strong style="font-weight: 600">{{l.used}}</strong><sc-if value="{{l.hasDiff}}" hint-placeholder-val="{{ false }}"><span class="hint">{{l.diff}}</span></sc-if></span></sc-if>
                      </span>
                      <span><span class="badge {{l.bcls}}">{{l.status}}</span></span>
                    </div>
                  </sc-for>
                </div>
                <sc-if value="{{j.noLines}}" hint-placeholder-val="{{ false }}"><div class="hint" style="padding: 10px 16px">No parts on this job.</div></sc-if>
              </div>
            </sc-for>
          </section>

          <!-- Photos -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Photos</h2><span class="muted" style="font-size: 12px">Shared with the customer on the inspection report</span><span class="sp"></span><label class="btn btn-secondary btn-sm file-btn"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add photo<input type="file" accept="image/*" aria-label="Add photo" onChange="{{rod.onPhoto}}"></label></div>
            <div class="panel-bd">
              <div class="photos"><sc-for list="{{rod.photos}}" as="ph" hint-placeholder-count="2"><figure class="photo" style="margin: 0"><div class="photo-img"><sc-if value="{{ph.hasUrl}}" hint-placeholder-val="{{ false }}"><img src="{{ph.url}}" alt="{{ph.name}}"></sc-if><sc-if value="{{ph.noUrl}}" hint-placeholder-val="{{ true }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></sc-if></div><figcaption class="photo-cap"><span class="ellip" style="font-weight: 500">{{ph.name}}</span><span class="hint">{{ph.meta}}</span></figcaption></figure></sc-for></div>
              <sc-if value="{{rod.noPhotos}}" hint-placeholder-val="{{ false }}"><div class="empty empty-sm"><span>No photos yet. Add before-and-after shots to build trust.</span></div></sc-if>
            </div>
          </section>

          <!-- Notes -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Notes</h2></div>
            <div class="panel-bd" style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{rod.notes}}" as="n" hint-placeholder-count="2"><div class="note"><span>{{n.text}}</span><span style="display: flex; gap: 8px; align-items: center"><span class="hint">{{n.meta}}</span><sc-if value="{{n.cust}}" hint-placeholder-val="{{ false }}"><span class="tag tag-blue">Customer-visible</span></sc-if></span></div></sc-for>
              <sc-if value="{{rod.noNotes}}" hint-placeholder-val="{{ false }}"><span class="hint">No notes yet.</span></sc-if>
              <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #E4E7EC; padding-top: 10px; margin-top: 4px">
                <textarea class="input textarea" aria-label="Add a note" placeholder="Add a note, e.g. Used 4.5 qt; capacity is 4.4 qt." value="{{rod.noteText}}" onChange="{{rod.onNote}}"></textarea>
                <div style="display: flex; align-items: center; gap: 8px"><label class="check" style="font-size: 12px"><input type="checkbox" checked="{{rod.noteCust}}" onChange="{{rod.onNoteCust}}"><span>Visible to customer</span></label><span class="sp"></span><span class="tipwrap" data-tip="{{rod.noteTip}}"><button class="btn btn-primary btn-sm" disabled="{{rod.noteDisabled}}" onClick="{{rod.addNote}}">Add note</button></span></div>
              </div>
            </div>
          </section>
        </div>

        <div class="stack">
          <!-- Time clock -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Time clock</h2></div>
            <div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px">
              <sc-if value="{{rod.showClock}}" hint-placeholder-val="{{ false }}">
                <div class="clock-big {{rod.clockCls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span style="flex: 1; font-weight: 500">{{rod.clockText}}</span><span class="tipwrap" data-tip="{{rod.clockTip}}"><button class="btn {{rod.clockBtnCls}}" disabled="{{rod.clockDisabled}}" onClick="{{rod.clock}}">{{rod.clockLabel}}</button></span></div>
              </sc-if>
              <div class="hours-meter"><div style="display: flex; font-size: 13px"><span>Actual <strong>{{rod.actual}}</strong></span><span class="sp"></span><span class="muted">Booked {{rod.booked}}</span></div><span class="meter"><span class="meter-fill {{rod.actCls}}" style="width: {{rod.actPct}}%"></span></span></div>
              <sc-for list="{{rod.running}}" as="rn" hint-placeholder-count="1"><span class="clock-on" style="font-size: 12px">{{rn.who}} clocked in since {{rn.since}}</span></sc-for>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <sc-for list="{{rod.sessions}}" as="se" hint-placeholder-count="1"><div style="display: flex; font-size: 12px; gap: 8px"><span style="flex: 1">{{se.who}} · {{se.date}} {{se.span}}</span><span class="muted">{{se.dur}}</span></div></sc-for>
                <sc-if value="{{rod.noSessions}}" hint-placeholder-val="{{ false }}"><span class="hint">No completed time sessions yet.</span></sc-if>
              </div>
            </div>
          </section>

          <!-- Assignment -->
          <section class="panel">
            <div class="panel-hd"><h2 class="h2">Assignment</h2></div>
            <div class="panel-bd" style="display: flex; flex-direction: column; gap: 12px">
              <sc-if value="{{rod.canAssign}}" hint-placeholder-val="{{ true }}">
                <div class="field"><span class="label" id="ro-tech-l">Technician</span><div class="pick-grid" role="radiogroup" aria-labelledby="ro-tech-l"><sc-for list="{{rod.techPicks}}" as="tp" hint-placeholder-count="4"><button class="pick {{tp.cls}}" role="radio" aria-checked="{{tp.on}}" onClick="{{tp.pick}}"><span style="font-weight: 500">{{tp.label}}</span><span class="hint">{{tp.sub}}</span></button></sc-for></div></div>
                <div class="field"><span class="label">Priority</span><div class="seg" role="group" aria-label="Priority"><sc-for list="{{rod.priPicks}}" as="pp" hint-placeholder-count="3"><button class="{{pp.cls}}" onClick="{{pp.pick}}">{{pp.label}}</button></sc-for></div></div>
                <div class="form-2">
                  <div class="field"><label class="label" for="ro-pd">Promised date</label><input id="ro-pd" class="input" type="date" value="{{rod.aDate}}" onChange="{{rod.onADate}}"></div>
                  <div class="field"><label class="label" for="ro-pt">Promised time</label><select id="ro-pt" class="select" value="{{rod.aTime}}" onChange="{{rod.onATime}}"><option value="09:00">9:00 AM</option><option value="10:00">10:00 AM</option><option value="11:00">11:00 AM</option><option value="12:00">12:00 PM</option><option value="13:00">1:00 PM</option><option value="14:00">2:00 PM</option><option value="15:00">3:00 PM</option><option value="16:00">4:00 PM</option><option value="16:30">4:30 PM</option><option value="17:00">5:00 PM</option><option value="17:30">5:30 PM</option><option value="18:00">6:00 PM</option></select></div>
                </div>
                <span class="tipwrap" data-tip="{{rod.asgTip}}" style="align-self: flex-end"><button class="btn btn-primary btn-sm" disabled="{{rod.asgDisabled}}" onClick="{{rod.saveAsg}}">Save assignment</button></span>
              </sc-if>
              <sc-if value="{{rod.isTech}}" hint-placeholder-val="{{ false }}">
                <dl class="kv"><dt>Technician</dt><dd>{{rod.techName}}</dd><dt>Promised</dt><dd>{{rod.promisedFull}}</dd><dt>Opened</dt><dd>{{rod.opened}}</dd></dl>
              </sc-if>
            </div>
